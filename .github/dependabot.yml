version: 2
updates:
  - package-ecosystem: "swift"
    directory: "/agtermCore"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
  - package-ecosystem: "swift"
    directory: "/agterm-linux"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
