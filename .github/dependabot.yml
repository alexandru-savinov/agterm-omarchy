version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: swift
    directory: /agtermCore
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
  - package-ecosystem: swift
    directory: /agterm-linux
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
