name: Omarchy bug
description: Report a reproducible build, packaging, or desktop failure.
title: "[Omarchy] "
body:
  - type: markdown
    attributes:
      value: For suspected vulnerabilities, use the [private security report](https://github.com/alexandru-savinov/agterm-omarchy/security/advisories/new). Setup questions belong in the [compatibility discussion](https://github.com/alexandru-savinov/agterm-omarchy/discussions/7).
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Omarchy version, uname -m, GTK version, Hyprland version, agterm commit or artifact name.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How agterm was installed
      options:
        - README release archive into ~/.local
        - omarchy-pkgs package
        - Built from source
        - Other
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: agterm version
      description: >-
        Paste the output of `agtermctl version` (it needs agterm running).
        If agterm does not start, give the release tag or archive name, or the output of `pacman -Q | grep agterm`.
        Write n/a for a build-only failure.
      render: text
    validations:
      required: true
  - type: textarea
    id: gpu
    attributes:
      label: GPU and driver
      description: Paste the output of `lspci -k | grep -A3 -E 'VGA|3D'`. In a VM, also name the hypervisor. Write n/a for a build-only failure.
      render: text
    validations:
      required: true
  - type: textarea
    id: renderer
    attributes:
      label: Renderer mode
      description: >-
        Paste the output of
        `cat ~/.local/lib/agterm/share/agterm/RENDERER /usr/lib/agterm/share/agterm/RENDERER 2>/dev/null; echo "LIBGL_ALWAYS_SOFTWARE=${LIBGL_ALWAYS_SOFTWARE-unset}"`.
        Write n/a for a build-only failure.
      render: text
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Exact steps or commands, expected result, and actual result. State whether you used an isolated test instance.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs and screenshots
      description: Attach relevant build output or scripts/test-omarchy.sh artifacts after removing private terminal text and host details.
  - type: dropdown
    id: backend
    attributes:
      label: Display backend
      options:
        - Native Wayland / Hyprland
        - XWayland / X11
        - Build or packaging only
        - Unknown
    validations:
      required: true
