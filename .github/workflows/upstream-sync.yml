name: Upstream sync

# One sync PR per umputun/agterm release (#476): main merged with the newest vX.Y.Z tag main lacks, on
# sync/umputun-<tag>. A clean merge opens a PR labelled upstream-sync; conflicts, or any change under .github/,
# open a draft labelled needs-adaptation with the markers committed. Nothing runs while syncing is paused
# (repository variable SYNC_PAUSED is true, or an issue labelled release-incident is open) or while any sync PR
# is open; a sync branch with no open PR fails the run until it is deleted. Gates and selection live in scripts/upstream-sync.py.
# Merge sync PRs as merge commits only: a squash leaves the tag outside main's history and it syncs again.
#
# Token: the push and the PR use UPSTREAM_SYNC_TOKEN, never GITHUB_TOKEN, which cannot push upstream's
# .github/workflows changes (no `workflows` permission) and cannot open PRs here (Actions PR creation is
# disabled). It is a fine-grained PAT for this repository only, with Contents, Pull requests and Workflows
# read/write. Store it as a secret of the `upstream-sync` environment, whose deployment branch policy allows
# main only, never as a repository secret: the pushed branch runs upstream-authored workflows, which can read
# every repository secret. A GitHub App instead needs a token-minting step in the publish job.
# GITHUB_TOKEN only creates the labels; the PAT applies one, so the labeled event triggers workflows.
on:
  schedule:
    - cron: '43 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan and merge on the runner only; push nothing and open no PR (uncheck to open the sync PR)
        required: false
        type: boolean
        default: true
      tag:
        description: Sync this umputun vX.Y.Z tag instead of the newest one; the same gates apply
        required: false
        type: string
        default: ""
  # A change to the sync itself dry-runs it on its own pull request.
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/upstream-sync.yml
      - scripts/upstream-sync.py
      - scripts/tests/test_upstream_sync.py
      - scripts/github/pr_fields.py

permissions:
  contents: read

concurrency:
  group: upstream-sync-${{ github.event_name == 'pull_request' && github.ref || 'live' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Sync unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/tests/test_upstream_sync.py -v

  sync:
    name: Plan and build the sync branch
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      action: ${{ steps.plan.outputs.action }}
      branch: ${{ steps.plan.outputs.branch }}
      title: ${{ steps.merge.outputs.title }}
      label: ${{ steps.merge.outputs.label }}
      draft: ${{ steps.merge.outputs.draft }}
      head: ${{ steps.merge.outputs.head }}
    env:
      DRY_RUN: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
      TAG_OVERRIDE: ${{ inputs.tag }}
      SYNC_PAUSED: ${{ vars.SYNC_PAUSED }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse a live run off main
        run: |
          if [[ "$DRY_RUN" != true && "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::a live sync runs only from main; dispatch with dry_run for $GITHUB_REF" >&2
            exit 1
          fi
      - name: List open release incidents
        env:
          GH_TOKEN: ${{ github.token }}
        # A failed listing fails the job: without it the pause cannot be evaluated.
        run: gh issue list --state open --label release-incident --limit 100 --json number > "$RUNNER_TEMP/incidents.json"
      - name: Check the pause
        id: pause
        # Before anything is fetched from umputun: a paused run does nothing else.
        run: python3 scripts/upstream-sync.py pause --paused "$SYNC_PAUSED" --incidents "$RUNNER_TEMP/incidents.json"
      - name: Fetch main and umputun release tags
        if: steps.pause.outputs.paused == 'false'
        run: |
          git fetch --quiet --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          # A private namespace, so upstream tags never mix with this repository's own.
          git fetch --quiet --no-tags https://github.com/umputun/agterm.git '+refs/tags/v*:refs/upstream-tags/v*'
          git ls-remote --heads origin 'refs/heads/sync/umputun-*' > "$RUNNER_TEMP/branches.txt"
      - name: List open pull requests
        if: steps.pause.outputs.paused == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        # A failed listing fails the job: without it the one-at-a-time gate cannot be evaluated.
        run: |
          gh pr list --state open --limit 1000 --json number,headRefName,isCrossRepository,labels \
            > "$RUNNER_TEMP/prs.json"
      - name: Plan
        id: plan
        if: steps.pause.outputs.paused == 'false'
        run: |
          python3 scripts/upstream-sync.py plan --base refs/remotes/origin/main \
            --open-prs "$RUNNER_TEMP/prs.json" --remote-branches "$RUNNER_TEMP/branches.txt" \
            --paused "$SYNC_PAUSED" --incidents "$RUNNER_TEMP/incidents.json" --tag "$TAG_OVERRIDE"
      - name: Build the sync branch
        id: merge
        # A dry run builds the merge even when a gate skips, so its log shows what a live run would open.
        if: steps.plan.outputs.action == 'sync' || (env.DRY_RUN == 'true' && steps.plan.outputs.tag != '')
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          COMMIT: ${{ steps.plan.outputs.commit }}
          BRANCH: ${{ steps.plan.outputs.branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir "$RUNNER_TEMP/out"
          python3 scripts/upstream-sync.py merge --base refs/remotes/origin/main --branch "$BRANCH" \
            --tag "$TAG" --commit "$COMMIT" --worktree "$RUNNER_TEMP/sync" --body "$RUNNER_TEMP/out/body.md" \
            --run-url "$RUN_URL"
          git -C "$RUNNER_TEMP/sync" bundle create "$RUNNER_TEMP/out/sync.bundle" "refs/heads/$BRANCH" \
            ^refs/remotes/origin/main
      - name: Hand the branch to the publish job
        if: steps.plan.outputs.action == 'sync' && env.DRY_RUN != 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: upstream-sync-branch
          path: ${{ runner.temp }}/out/
          retention-days: 1
          if-no-files-found: error
      - name: Summary
        if: always() && steps.pause.outcome == 'success'
        env:
          ACTION: ${{ steps.plan.outputs.action || 'skip' }}
          REASON: ${{ steps.plan.outputs.reason || steps.pause.outputs.reason }}
          TAG: ${{ steps.plan.outputs.tag }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
          GITHUB_CHANGES: ${{ steps.merge.outputs.github_changes }}
        run: |
          {
            echo "### Upstream sync ($([[ "$DRY_RUN" == true ]] && echo 'dry run' || echo live))"
            echo
            echo "- decision: \`$ACTION\` ($REASON)"
            [[ -z "$TAG" ]] || echo "- tag: \`$TAG\`, conflicted paths: ${CONFLICTS:-not built}, changes under .github/: ${GITHUB_CHANGES:-not built}"
            if [[ -f "$RUNNER_TEMP/out/body.md" ]]; then
              echo
              echo '<details><summary>PR body</summary>'
              echo
              cat "$RUNNER_TEMP/out/body.md"
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail on a stranded sync branch
        if: steps.plan.outputs.action == 'blocked'
        env:
          REASON: ${{ steps.plan.outputs.reason }}
        run: |
          echo "::error::$REASON" >&2
          exit 1

  publish:
    name: Push the branch and open the sync PR
    needs: sync
    if: >-
      needs.sync.outputs.action == 'sync' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: upstream-sync
    permissions:
      contents: read
      issues: write
    env:
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ needs.sync.outputs.branch }}
      HEAD_SHA: ${{ needs.sync.outputs.head }}
    steps:
      - name: Require the sync token
        env:
          HAVE_SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN != '' }}
        run: |
          if [[ "$HAVE_SYNC_TOKEN" != true ]]; then
            echo "::error::the upstream-sync environment has no UPSTREAM_SYNC_TOKEN secret; see the top of upstream-sync.yml" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: upstream-sync-branch
          path: ${{ runner.temp }}/in
      - name: Load the branch exactly as built
        run: |
          git fetch --quiet "$RUNNER_TEMP/in/sync.bundle" "refs/heads/$BRANCH:refs/heads/$BRANCH"
          got="$(git rev-parse "refs/heads/$BRANCH")"
          [[ "$got" == "$HEAD_SHA" ]] || { echo "::error::bundle holds $got, the sync job built $HEAD_SHA" >&2; exit 1; }
      - name: Create the sync labels if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 422 means the label already exists.
          create() {
            local out
            out="$(gh api "repos/$GH_REPO/labels" -f "name=$1" -f "color=$2" -f "description=$3" 2>&1)" \
              || grep -q 'already_exists' <<< "$out" || { echo "$out" >&2; return 1; }
          }
          create upstream-sync 0e8a16 'Automated umputun/agterm release sync that merged cleanly'
          create needs-adaptation d93f0b 'Automated umputun/agterm sync with conflicts or .github/ changes to resolve'
      - name: Push the branch and open the PR
        id: pr
        env:
          SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          TITLE: ${{ needs.sync.outputs.title }}
          DRAFT: ${{ needs.sync.outputs.draft }}
          LABEL: ${{ needs.sync.outputs.label }}
        run: |
          auth="$(printf 'x-access-token:%s' "$SYNC_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          # Through the environment, so the credential is in no argv and no persisted git config.
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          # A pushed branch without its PR would block every later run, so a failed PR takes the branch back,
          # and only while it still points at what this run pushed.
          pushed='' opened=''
          withdraw() {
            [[ -n "$pushed" && -z "$opened" ]] || return 0
            # gh pr create can fail after the PR exists (applying the label, say); that PR keeps its branch.
            local open
            if ! open="$(GH_TOKEN="$SYNC_TOKEN" gh pr list --head "$BRANCH" --state open \
                --json isCrossRepository --jq '[.[] | select(.isCrossRepository | not)] | length')"; then
              echo "::error::could not check for a PR on $BRANCH; left the branch in place" >&2
              return 0
            fi
            if [[ "$open" != 0 ]]; then
              echo "::error::the PR for $BRANCH was opened but gh pr create failed; check its label" >&2
              return 0
            fi
            git push --force-with-lease="refs/heads/$BRANCH:$HEAD_SHA" origin ":refs/heads/$BRANCH" \
              || echo "::error::could not delete $BRANCH after the PR failed; delete it by hand" >&2
          }
          trap withdraw EXIT
          # The plan gated on the branch not existing; a plain push never rewrites one created since.
          git push origin "refs/heads/$BRANCH:refs/heads/$BRANCH"
          pushed=1
          draft=()
          [[ "$DRAFT" != true ]] || draft=(--draft)
          url="$(GH_TOKEN="$SYNC_TOKEN" gh pr create --base main --head "$BRANCH" --title "$TITLE" \
            --label "$LABEL" --body-file "$RUNNER_TEMP/in/body.md" "${draft[@]}")"
          opened=1
          echo "number=${url##*/}" >> "$GITHUB_OUTPUT"
          echo "- opened: $url" >> "$GITHUB_STEP_SUMMARY"
