name: Omarchy native gates self-test

# The renamed workflow cannot supply a main archive until the #483 cutover. Keep this caller report-only
# during the cutover, then require attestation once a main run has signed and verified both archives.
on:
  pull_request:
    paths:
      - .github/workflows/omarchy-native-gates-self-test.yml
      - .github/workflows/omarchy-x86-native.yml
      - .github/omarchy-x86-native/**
      # ci-artifact.py runs the promotion's checks, and its test runs on the promotion tests' fixture.
      - scripts/prepare-omarchy-prerelease.py
      - scripts/tests/test_omarchy_prerelease.py

permissions:
  contents: read

jobs:
  source-run:
    name: Find a releasable main CI run
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.source.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the renamed CI workflow
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/prepare-omarchy-prerelease.py --discover --releasable
      - name: Explain missing attestation source
        if: steps.source.outputs.run == ''
        run: echo 'Native gates skipped because omarchy-ci.yml has no releasable run on main.' >> "$GITHUB_STEP_SUMMARY"

  self-test:
    needs: source-run
    if: needs.source-run.outputs.run != ''
    uses: $/.github/workflows/omarchy-x86-native.yml
    permissions:
      contents: read
      actions: read
      attestations: read
    with:
      source: ci-run
      run_id: ${{ needs.source-run.outputs.run }}
      arch: both
      channel: stable
      attestation: report-only
