name: AT-SPI targeted rerun

# Diagnosis aid: rerun one or a few named GTK AT-SPI scenarios against a branch or SHA in minutes instead
# of the whole suite. It is NOT a required check and NEVER replaces the full suite: a merge still needs the
# complete "GTK build and tests" AT-SPI run in ci.yml. A green run here only says the named scenarios
# passed once on this ref.
#
# The selection tooling comes from this workflow's own revision; the app, the scenario list and
# test-linux-ui.sh come from the requested ref, so refs that predate this workflow can be rerun too.
# Runtime caches are restored, never saved: cache-mode: read makes the job's cache token read-only, so code
# from a dispatched ref cannot seed the caches ci.yml trusts (workflow_dispatch would otherwise get write).
# The two build images below must stay equal to the build-linux matrix in ci.yml.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit SHA to test
        required: true
        type: string
      arch:
        description: Architecture(s) to run on
        required: true
        type: choice
        options: [x86_64, aarch64, both]
        default: x86_64
      scenarios:
        description: Comma-separated scenario names from agterm-linux/tests/atspi_smoke.py, e.g. normal,context-menu
        required: true
        type: string

permissions:
  contents: read

cache-mode: read

defaults:
  run:
    shell: bash

env:
  IMAGE_X86_64: ghcr.io/alexandru-savinov/agterm-omarchy-build-x86_64@sha256:e2d48733b2fd8481c314bd639fd15e523110e106418cb982cc830a7e620a839f
  IMAGE_AARCH64: ghcr.io/alexandru-savinov/agterm-omarchy-build-aarch64@sha256:4aec8a361df2c3d98bbfd75fe7c4be54a429d490497236e143bc27d8e705d0f4

jobs:
  select:
    name: Validate scenarios
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.validate.outputs.sha }}
      matrix: ${{ steps.validate.outputs.matrix }}
    steps:
      - name: Check out selection tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: tooling
          sparse-checkout: scripts/test-linux-ui-targeted.py
          sparse-checkout-cone-mode: false
      - name: Check out scenario list from the requested ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
          path: target
          sparse-checkout: agterm-linux/tests/atspi_smoke.py
          sparse-checkout-cone-mode: false
      - name: Validate names and resolve the run matrix
        id: validate
        env:
          SCENARIOS: ${{ inputs.scenarios }}
          ARCH: ${{ inputs.arch }}
        run: |
          python3 -I tooling/scripts/test-linux-ui-targeted.py "$SCENARIOS" --root target --check-only
          sha="$(git -C target rev-parse HEAD)"
          matrix="$(python3 -I -c '
          import json, os, sys
          rows = {"x86_64": ("ubuntu-24.04", os.environ["IMAGE_X86_64"]),
                  "aarch64": ("ubuntu-24.04-arm", os.environ["IMAGE_AARCH64"])}
          arch = os.environ["ARCH"]
          names = list(rows) if arch == "both" else [arch]
          if any(name not in rows for name in names):
              sys.exit(f"unknown arch: {arch!r}")
          print(json.dumps([{"arch": name, "runner": rows[name][0], "container": rows[name][1]} for name in names]))
          ')"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          printf '### Targeted AT-SPI rerun (not a merge gate)\nref: %s\nscenarios: %s\n' \
            "$sha" "$SCENARIOS" >> "$GITHUB_STEP_SUMMARY"

  atspi:
    name: AT-SPI targeted (${{ matrix.arch }})
    needs: select
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    container: ${{ matrix.container }}
    steps:
      - name: Check out the requested ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.select.outputs.sha }}
      - name: Check out selection tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: .atspi-targeted-tooling
          sparse-checkout: scripts/test-linux-ui-targeted.py
          sparse-checkout-cone-mode: false
      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Verify pinned GTK build image
        run: /usr/local/bin/agterm-build-image-probe
      - name: Resolve Linux architecture
        id: linux-architecture
        run: |
          source linux/arch.sh
          echo "host=$HOST_ARCH" >> "$GITHUB_OUTPUT"
      # Same paths and key as ci.yml's build-linux job, so a ref whose runtime inputs match main hits the
      # cache ci.yml saved. Restore only: see the header.
      - name: Restore vendored Linux runtimes
        id: ghostty-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            agterm-linux/vendor/ghostty
            agterm-linux/vendor/zmx
          key: linux-runtimes-${{ steps.linux-architecture.outputs.host }}-${{ hashFiles('scripts/setup-linux.sh', 'scripts/verify-linux-vendor-cache.sh', 'scripts/verify-linux-zmx-cache.sh', 'scripts/verify-linux-architecture.sh', 'scripts/verify-linux-resources.sh', 'scripts/linux-notices.py', 'packaging/linux/notices/**', 'scripts/zmx-patches/**/*.patch', 'linux/arch.sh', 'linux/ghostty-resources.env', 'linux/zmx.env', 'linux/patches/ghostty-embedded-opengl.patch', 'linux/patches/ghostty-embedded-input-handoff.patch', 'linux/patches/ghostty-lib-resources.patch', 'linux/patches/ghostty-clipboard-request-kind.patch', 'linux/patches/ghostty-surface-env-unset.patch') }}
      - name: Verify restored libghostty cache
        if: steps.ghostty-cache.outputs.cache-hit == 'true'
        run: scripts/verify-linux-vendor-cache.sh agterm-linux/vendor/ghostty
      - name: Verify restored zmx cache
        if: steps.ghostty-cache.outputs.cache-hit == 'true'
        run: scripts/verify-linux-zmx-cache.sh agterm-linux/vendor/zmx
      - name: Build libghostty (skips if the cache restored it)
        run: scripts/setup-linux.sh
      - name: Verify built libghostty cache
        run: scripts/verify-linux-vendor-cache.sh agterm-linux/vendor/ghostty
      - name: Verify built zmx cache
        run: scripts/verify-linux-zmx-cache.sh agterm-linux/vendor/zmx
      - name: swift build (agterm-linux)
        working-directory: agterm-linux
        run: swift build
      - name: GTK AT-SPI targeted scenarios
        env:
          SCENARIOS: ${{ inputs.scenarios }}
          AGTERM_UI_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/linux-ui
        run: python3 -I .atspi-targeted-tooling/scripts/test-linux-ui-targeted.py "$SCENARIOS" --root "$GITHUB_WORKSPACE"
      - name: Upload GTK diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: linux-ui-targeted-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/linux-ui
          if-no-files-found: warn
