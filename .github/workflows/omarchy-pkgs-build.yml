name: omarchy-pkgs recipe build

# Builds the draft agterm-omarchy-bin recipe (#465/#466) with omacom/omarchy-pkgs' own bin/build, on the
# runners its CI uses for each architecture, then inspects the package and runs the repository's recipe checks.
# The install job then installs, runs and removes the x86_64 package in the native gates' container.
# Nothing is pushed to omarchy-pkgs. Not a required check. The pull_request trigger runs only when the recipe,
# this workflow or its scripts change, because a dispatch-only workflow cannot run before it reaches main.

on:
  workflow_dispatch:
    inputs:
      omarchy_pkgs_ref:
        description: omacom/omarchy-pkgs commit to build with
        required: true
        type: string
        default: 5c7d21d2af2fa1bea38b5c0dffeda4dfe40a6ab6
  pull_request:
    paths:
      - packaging/omarchy-pkgs/**
      - .github/workflows/omarchy-pkgs-build.yml
      - .github/omarchy-pkgs-build/**
      - .github/omarchy-x86-native/gates.sh
      - scripts/test-omarchy.sh

permissions:
  contents: read

concurrency:
  group: omarchy-pkgs-build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  OMARCHY_PKGS_REF: ${{ inputs.omarchy_pkgs_ref || '5c7d21d2af2fa1bea38b5c0dffeda4dfe40a6ab6' }}
  PACKAGE: agterm-omarchy-bin
  ARCH_IMAGE: archlinux:base-devel@sha256:fa2d4ce3310ddd90a4208e5168be8ad367da5129af1245f38fd2d803bcbe3239

jobs:
  build:
    name: bin/build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint the scripts
        run: |
          for script in .github/omarchy-pkgs-build/*.sh; do
            bash -n "$script"
            shellcheck "$script"
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: omacom/omarchy-pkgs
          ref: ${{ env.OMARCHY_PKGS_REF }}
          path: omarchy-pkgs
          persist-credentials: false
      - name: Add the recipe
        run: |
          [[ ! -e "omarchy-pkgs/pkgbuilds/$PACKAGE" ]] || { echo "omarchy-pkgs already has $PACKAGE"; exit 1; }
          cp -R "packaging/omarchy-pkgs/$PACKAGE" omarchy-pkgs/pkgbuilds/
          mkdir -p "$RUNNER_TEMP/out"
      - name: bin/build
        id: build
        working-directory: omarchy-pkgs
        env:
          CONTAINER_ENGINE: docker
        run: |
          # As build-pr.yml does: use the published builder image for these build inputs when one exists.
          published="ghcr.io/omacom/omarchy-pkg-builder:$(bin/builder-image key --arch "${{ matrix.arch }}" --mirror edge)"
          if docker pull --quiet "$published"; then
            docker tag "$published" "omarchy-pkg-builder:latest-${{ matrix.arch }}-edge"
            export OMARCHY_SKIP_BUILDER_IMAGE=1
            echo "builder image: $published" | tee "$RUNNER_TEMP/out/builder-image.txt"
          else
            echo "builder image: built locally" | tee "$RUNNER_TEMP/out/builder-image.txt"
          fi
          bin/build --mirror edge --arch "${{ matrix.arch }}" --package "$PACKAGE"
          find build-output -name "$PACKAGE-*.pkg.tar.zst" -exec cp {} "$RUNNER_TEMP/out/" \;
          (cd "$RUNNER_TEMP/out" && sha256sum ./*.pkg.tar.zst | tee SHA256SUMS)
      - name: Inspect the package
        run: |
          pkg=$(find "$RUNNER_TEMP/out" -maxdepth 1 -name "$PACKAGE-*.pkg.tar.zst")
          docker run --rm --user 0 -v "$PWD/.github/omarchy-pkgs-build:/scripts:ro" \
            -v "$PWD/packaging/omarchy-pkgs/$PACKAGE:/pkgbuild:ro" \
            -v "$pkg:/pkg/$(basename "$pkg"):ro" -v "$RUNNER_TEMP/out:/out" \
            "omarchy-pkg-builder:latest-${{ matrix.arch }}-edge" \
            bash /scripts/inspect.sh "/pkg/$(basename "$pkg")" /out
      - name: Run the omarchy-pkgs recipe checks
        # check-shadowed compares against Arch's x86_64 repositories; the other checks read recipes only.
        # They run even when the package inspection fails, so one run reports both.
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.arch == 'x86_64' }}
        run: |
          docker run --rm -v "$PWD/.github/omarchy-pkgs-build:/scripts:ro" \
            -v "$PWD/packaging/omarchy-pkgs/owners.json.line:/owners.json.line:ro" \
            -v "$PWD/omarchy-pkgs:/src:ro" -v "$RUNNER_TEMP/out:/out" \
            "$ARCH_IMAGE" bash -lc '
              set -euo pipefail
              printf "\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n" >> /etc/pacman.conf
              pacman -Syu --noconfirm --needed git jq python python-yaml libarchive pacman-contrib >/dev/null
              useradd -m builder
              cp -a /src /work && chown -R builder: /work && chmod a+rwx /out
              runuser -u builder -- git config --global --add safe.directory /work
              runuser -u builder -- bash /scripts/repo-checks.sh /work /owners.json.line /out'
      - name: Summary
        if: always()
        run: |
          {
            printf '### %s %s\nomarchy-pkgs: %s\n\n<pre>\n' "$PACKAGE" "${{ matrix.arch }}" "$OMARCHY_PKGS_REF"
            cat "$RUNNER_TEMP/out/SHA256SUMS" "$RUNNER_TEMP/out/checks.tsv" "$RUNNER_TEMP/out/repo-checks.tsv" 2>/dev/null || true
            printf '</pre>\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the package and evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: omarchy-pkgs-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/out
          retention-days: 30

  install:
    # The x86_64 counterpart of the aarch64 VM test: pacman -U, the ordinary and Live harness through /usr/bin
    # under Hyprland, and pacman -R, in the native gates' x86_64 container (install-smoke.sh). No hardware.
    name: pacman -U and Hyprland x86_64 (Arch container, vkms)
    needs: build
    runs-on: ubuntu-24.04
    # Budget as the native gates job: vkms 5 + download 5 + image 10 + container 70 (setup 15 + session 50 +
    # kill grace) + staging 5 + upload 5 = 100.
    timeout-minutes: 105
    env:
      OMARCHY_CHANNEL: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
      - name: Load vkms
        timeout-minutes: 5
        run: |
          if ! sudo modprobe vkms; then
            sudo apt-get update
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe vkms
          fi
          mkdir -p "$RUNNER_TEMP/out" "$RUNNER_TEMP/pkg"
          { uname -srm; ls -l /dev/dri; } | tee "$RUNNER_TEMP/out/host.txt"
      # A rerun of only this job reuses the build's artifact from an earlier attempt.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          pattern: omarchy-pkgs-x86_64-${{ github.run_id }}-*
          path: ${{ runner.temp }}/artifacts
      - name: Select the built package
        run: |
          # One matching artifact is extracted into the path itself, several into one directory each.
          dir="$(find "$RUNNER_TEMP/artifacts" -name SHA256SUMS -printf '%h\n' | sort -V | tail -1)"
          [[ -n "$dir" ]] || { echo "::error::no built package artifact"; exit 1; }
          (cd "$dir" && sha256sum --check --strict SHA256SUMS) | tee "$RUNNER_TEMP/out/package-check.txt"
          pkg="$(find "$dir" -maxdepth 1 -name "$PACKAGE-*-x86_64.pkg.tar.zst")"
          cp "$pkg" "$RUNNER_TEMP/pkg/"
          echo "PKG_FILE=$(basename "$pkg")" >> "$GITHUB_ENV"
          echo "package: $(basename "$dir")/$(basename "$pkg")" | tee -a "$RUNNER_TEMP/out/package-check.txt"
      - name: Prepare the Arch base image
        timeout-minutes: 10
        run: docker pull "$ARCH_IMAGE"
      - name: Install, run and remove the package
        timeout-minutes: 70
        # The native gates' container options, for WebKitGTK's bwrap sandbox; see omarchy-x86-native.yml.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          docker run --rm --name omarchy-pkg-install --device /dev/dri -v /run/udev:/run/udev:ro \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined --security-opt systempaths=unconfined \
            -e PKG_FILE -e OMARCHY_CHANNEL -v "$GITHUB_WORKSPACE:/repo:ro" -v "$RUNNER_TEMP/pkg:/pkg:ro" -v "$RUNNER_TEMP/out:/out" \
            "$ARCH_IMAGE" bash /repo/.github/omarchy-pkgs-build/install-smoke.sh
      - name: Stage the evidence
        id: stage
        if: always()
        timeout-minutes: 5
        run: |
          docker rm -f omarchy-pkg-install > /dev/null 2>&1 || true
          python3 -I .github/omarchy-x86-native/stage-evidence.py "$RUNNER_TEMP/out" "$RUNNER_TEMP/evidence"
          {
            printf '### %s x86_64 install (%s channel)\n\n<pre>\n' "$PACKAGE" "$OMARCHY_CHANNEL"
            cat "$RUNNER_TEMP/evidence/install.tsv" "$RUNNER_TEMP/evidence/gates.tsv" 2>/dev/null || echo 'no results'
            printf '</pre>\n'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "staged=true" >> "$GITHUB_OUTPUT"
      - name: Upload evidence
        if: always() && steps.stage.outputs.staged == 'true'
        timeout-minutes: 5
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: omarchy-pkgs-install-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          retention-days: 30
