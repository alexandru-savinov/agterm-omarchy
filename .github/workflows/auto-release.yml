name: Omarchy automatic release

on:
  workflow_run:
    workflows: [Omarchy CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '19 */2 * * *'
  workflow_dispatch:
    inputs:
      force_failure:
        description: Rehearse retraction with a simulated red gate
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  candidate:
    if: >-
      github.repository == 'alexandru-savinov/agterm-omarchy' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run_id: ${{ steps.plan.outputs.run_id }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      # Use the workflow's trusted main checkout, never the event's ref or its artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select a release candidate
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_PAUSED: ${{ vars.SYNC_PAUSED }}
        run: python3 -I scripts/omarchy-auto-release.py plan

  native_candidate:
    needs: candidate
    if: needs.candidate.outputs.run_id != ''
    permissions:
      contents: read
      actions: read
    # #475 wiring: replace runs-on, timeout-minutes, outputs and steps with:
    # uses: ./.github/workflows/omarchy-x86-native.yml
    # with:
    #   source: ci-run
    #   run_id: ${{ needs.candidate.outputs.run_id }}
    #   arch: both
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      passed: 'false'
      source_commit: ''
    steps:
      - run: |
          echo '::warning::Awaiting #475. No native evidence, so promotion is blocked.'

  promote:
    needs: [candidate, native_candidate]
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.native_candidate.outputs.passed == 'true' &&
      needs.native_candidate.outputs.source_commit == needs.candidate.outputs.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: omarchy-auto-release-promote
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    outputs:
      tag: ${{ steps.promote.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Recheck main, the CI attempt and pause, then dispatch #470
        id: promote
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_PAUSED: ${{ vars.SYNC_PAUSED }}
          SYNC_PAUSE_TOKEN: ${{ secrets.SYNC_PAUSE_TOKEN }}
        run: python3 -I scripts/omarchy-auto-release.py promote

  watch_recent:
    if: github.repository == 'alexandru-savinov/agterm-omarchy' && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tags: ${{ steps.watch.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find stable releases published in the last 24 hours
        id: watch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/omarchy-auto-release.py watch-tags

  watch_promotion:
    needs: promote
    if: needs.promote.outputs.tag != ''
    uses: ./.github/workflows/auto-release-watch.yml
    with:
      tag: ${{ needs.promote.outputs.tag }}
    permissions:
      contents: write
      actions: read
      issues: write
    secrets:
      SYNC_PAUSE_TOKEN: ${{ secrets.SYNC_PAUSE_TOKEN }}

  watch_scheduled:
    needs: watch_recent
    if: needs.watch_recent.outputs.tags != '' && needs.watch_recent.outputs.tags != '[]'
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.watch_recent.outputs.tags || '[]') }}
    uses: ./.github/workflows/auto-release-watch.yml
    with:
      tag: ${{ matrix.tag }}
    permissions:
      contents: write
      actions: read
      issues: write
    secrets:
      SYNC_PAUSE_TOKEN: ${{ secrets.SYNC_PAUSE_TOKEN }}

  dry_run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the release state machine with fixtures
        run: python3 -I scripts/tests/test_omarchy_auto_release.py
      - name: Rehearse retract-and-pause without touching GitHub
        if: inputs.force_failure
        shell: bash
        run: |
          python3 -I scripts/omarchy-auto-release.py retract --dry-run --tag omarchy-v0.43.0.1 \
            --reason 'Forced watch failure' --evidence 'Synthetic release' | tee "$GITHUB_STEP_SUMMARY"
