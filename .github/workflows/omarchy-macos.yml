name: Omarchy macOS validation

# The fork's CI builds only the Linux targets, so a shared-core change once left the macOS app
# uncompilable for two months (#370). This builds and tests the macOS app on main every week, and on
# demand for any branch, and on pushes to main.
# Not a required check: hosted macOS runners are scarce.
on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  # A unique push group also keeps GitHub from replacing a pending main run.
  group: omarchy-macos-${{ github.event_name == 'push' && format('push-{0}', github.run_id) || github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'upstream-sync' && github.event.label.name != 'upstream-offer' && github.run_id || '' }}${{ github.event.pull_request.number == 551 && github.event.pull_request.draft && github.event.pull_request.head.ref == 'claude/conditional-ci-pilot' && format('-round3-{0}', github.run_id) || '' }}
  # Give a running PR sample time to record a mismatch.
  cancel-in-progress: ${{ github.event_name != 'pull_request' && github.event_name != 'push' }}

jobs:
  changes:
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.action != 'labeled' ||
       github.event.label.name == 'upstream-sync' || github.event.label.name == 'upstream-offer')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    outputs:
      shared: ${{ steps.paths.outputs.shared }}
      decision: ${{ steps.local.outcome == 'success' && steps.local.outputs.decision || 'hosted' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: paths
        with:
          filters: |
            shared:
              - 'agtermCore/**'
              - '.github/workflows/omarchy-macos.yml'
              - 'scripts/github/conditional_macos.py'
              - 'scripts/local-check.sh'
      - name: Check out the pilot decision script
        if: >-
          github.repository == 'alexandru-savinov/agterm-omarchy' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login == 'alexandru-savinov' &&
          github.actor == 'alexandru-savinov' &&
          !contains(github.event.pull_request.labels.*.name, 'upstream-offer') &&
          (steps.paths.outputs.shared == 'true' || contains(github.event.pull_request.labels.*.name, 'upstream-sync'))
        id: pilot-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          # The draft pilot's original base predates this script. Pin that one bootstrap
          # to the pilot commit for review. All other runs use the exact PR base.
          ref: ${{ github.event.pull_request.base.sha == '1c89b2177e4376ee323c5e90b80cb65017671ded' && github.event.pull_request.head.ref == 'claude/conditional-ci-pilot' && 'a94c09a04b274b9d55fcb9ab56da2e28363aeef4' || github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Decide whether local evidence is eligible
        if: steps.pilot-checkout.outcome == 'success'
        id: local
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/github/conditional_macos.py

  macos:
    name: Hosted macOS checks
    needs: changes
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' ||
       ((needs.changes.result != 'success' || needs.changes.outputs.decision != 'skip') &&
        (github.event.action != 'labeled' ||
         github.event.label.name == 'upstream-sync' || github.event.label.name == 'upstream-offer') &&
        (contains(github.event.pull_request.labels.*.name, 'upstream-sync') ||
         contains(github.event.pull_request.labels.*.name, 'upstream-offer') ||
         (needs.changes.result == 'success' && needs.changes.outputs.shared == 'true'))))
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record source and toolchain identity
        run: |
          mkdir -p validation-logs
          {
            git rev-parse HEAD
            sw_vers
            uname -m
            xcodebuild -version
            swift --version
          } | tee validation-logs/identity.log
      - name: Install Node for plugin tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install upstream prerequisites
        run: |
          brew install xcodegen swiftlint fish
          sudo dscl . -create "/Users/$(id -un)" UserShell /bin/zsh
          {
            xcodegen --version
            swiftlint version
            command -v fish
            fish --version
            node --version
            node -e 'const [major, minor] = process.versions.node.split(".").map(Number); if (major !== 22 || minor < 7) process.exit(1)'
          } | tee validation-logs/prerequisites.log
      - name: Read pinned vendor revisions
        id: revisions
        run: |
          ghostty=$(sed -nE 's/^GHOSTTY_REV="([^"]+)".*/\1/p' scripts/setup.sh)
          zmx=$(sed -nE 's/^ZMX_REV="([^"]+)".*/\1/p' scripts/setup.sh)
          target=$(sed -nE 's/^ZMX_TARGET="([^"]+)".*/\1/p' scripts/setup.sh)
          test -n "$ghostty" && test -n "$zmx" && test -n "$target"
          {
            echo "ghostty=$ghostty"
            echo "zmx=$zmx"
            echo "target=$target"
          } >> "$GITHUB_OUTPUT"
      - name: Cache pinned GhosttyKit and resources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            GhosttyKit.xcframework
            agterm/Resources/ghostty
            agterm/Resources/terminfo
            .ghostty-build-stamp
          key: macos-weekly-macos26-${{ runner.arch }}-ghostty-${{ steps.revisions.outputs.ghostty }}-${{ hashFiles('scripts/setup.sh', 'scripts/ghostty-patches/*.patch') }}
      - name: Cache pinned zmx
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            agterm/Resources/zmx
            .zmx-build-stamp
          key: macos-weekly-macos26-${{ runner.arch }}-zmx-${{ steps.revisions.outputs.zmx }}-${{ steps.revisions.outputs.target }}-${{ hashFiles('scripts/setup.sh', 'scripts/zmx-patches-macos/**/*.patch') }}
      - name: Stage upstream runtime dependencies
        id: prepare
        run: |
          scripts/setup.sh 2>&1 | tee validation-logs/setup.log
      # Attempt every required gate even if another gate fails; no failure is suppressed.
      - name: make build
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: make build 2>&1 | tee validation-logs/make-build.log
      - name: make test
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        env:
          AGTERM_REQUIRE_FISH: '1'
          AGTERM_REQUIRE_ZMX: '1'
        run: make test 2>&1 | tee validation-logs/make-test.log
      - name: make test-app
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        env:
          TEST_RUNNER_AGTERM_REQUIRE_FISH: '1'
        run: make test-app 2>&1 | tee validation-logs/make-test-app.log
      - name: make lint
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: make lint 2>&1 | tee validation-logs/make-lint.log
      - name: Retain validation logs and XCTest results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: omarchy-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            validation-logs
            build/DerivedData/Logs/Test
          retention-days: 14
          if-no-files-found: warn

  sample-mismatch:
    name: Conditional macOS sample mismatch
    needs: [changes, macos]
    if: >-
      !cancelled() &&
      github.event_name == 'pull_request' &&
      github.repository == 'alexandru-savinov/agterm-omarchy' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'alexandru-savinov' &&
      github.actor == 'alexandru-savinov' &&
      needs.changes.outputs.decision == 'sample' && needs.macos.result == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Record the incident and pause local macOS skips
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This job checks out no PR code. The state branch has one file and no workflows.
          run_url="https://github.com/alexandru-savinov/agterm-omarchy/actions/runs/$GITHUB_RUN_ID"
          incident=$(jq -cn --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --arg merge "$GITHUB_SHA" --arg url "$run_url" \
            '{event:"conditional-ci-sample-mismatch",check:"macos-validation",run:$run,attempt:$attempt,merge:$merge,url:$url}')
          echo "::error title=Conditional macOS sample mismatch::${incident}"
          endpoint="repos/alexandru-savinov/agterm-omarchy/git"
          pause_ref=refs/heads/ci-state/conditional-macos
          paused() {
            gh api "$endpoint/matching-refs/heads/ci-state/conditional-macos" \
              --jq 'any(.[]; .ref == "refs/heads/ci-state/conditional-macos")' | grep -qx true
          }
          if paused; then
            echo "Confirmed existing $pause_ref on GitHub."
            exit 0
          fi
          echo "Creating $pause_ref."
          blob=$(gh api --method POST "$endpoint/blobs" -f content="$incident" -f encoding=utf-8 --jq .sha)
          tree=$(jq -cn --arg sha "$blob" \
            '{tree:[{path:"macos-local-ci-paused.json",mode:"100644",type:"blob",sha:$sha}]}' |
            gh api --method POST "$endpoint/trees" --input - --jq .sha)
          commit=$(jq -cn --arg tree "$tree" \
            '{message:"Pause conditional macOS CI pending review",tree:$tree,parents:[]}' |
            gh api --method POST "$endpoint/commits" --input - --jq .sha)
          if gh api --method POST "$endpoint/refs" -f ref="$pause_ref" -f sha="$commit" --silent; then
            echo "GitHub accepted creation for $pause_ref at $commit."
          else
            echo "GitHub did not accept creation for $pause_ref. Checking for a concurrent pause."
          fi
          if ! paused; then
            echo "::error title=Conditional macOS pause failed::Could not confirm $pause_ref. Hold the pilot pending review."
            exit 1
          fi
          echo "Confirmed $pause_ref on GitHub."
      - name: Fail the validation for the sample mismatch
        run: exit 1
