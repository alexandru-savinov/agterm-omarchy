name: Governance fixture validation

on:
  pull_request:
    branches: [validation/governance-33]

permissions:
  contents: read

jobs:
  fixture:
    name: Governance fixture checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Exercise existing artifact provenance regressions
        run: python3 scripts/tests/test_omarchy_prerelease.py
      - name: Validate the explicitly non-application governance receipt
        env:
          EXPECTED_SOURCE: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          receipt = json.loads(Path('packaging/linux/governance-33.json').read_text())
          assert receipt['fixture_only'] is True, 'receipt must identify itself as a fixture'
          assert receipt['application_acceptance'] is False, 'fixture cannot claim application acceptance'
          assert receipt['scope'] == 'validation/governance-33', 'wrong validation scope'
          source = receipt['source_revision']
          assert re.fullmatch('[0-9a-f]{40}', source), 'source_revision must be a full immutable commit SHA'
          assert source == os.environ['EXPECTED_SOURCE'], 'receipt must identify the exact validation base'
          assert receipt['architectures'] == ['aarch64', 'x86_64'], 'use canonical Linux architecture names'
          print('PASS: governance-only source receipt; this is not application acceptance')
          PY
