name: Cancellation gate probe
on:
  workflow_dispatch:
    inputs:
      outcome:
        type: choice
        options: [success, failure, skip, hold]
        default: success
permissions: {}
concurrency:
  group: cancellation-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prerequisite:
    if: inputs.outcome != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          OUTCOME: ${{ inputs.outcome }}
        run: |
          case "$OUTCOME" in
            success) exit 0 ;;
            failure) exit 1 ;;
            hold) sleep 180 ;;
            *) exit 2 ;;
          esac
  always-gate:
    needs: prerequisite
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULT: ${{ needs.prerequisite.result }}
        run: |
          case "$RESULT" in success|skipped) exit 0 ;; *) exit 1 ;; esac
  cancellation-aware-gate:
    needs: prerequisite
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULT: ${{ needs.prerequisite.result }}
        run: |
          case "$RESULT" in success|skipped) exit 0 ;; *) exit 1 ;; esac
