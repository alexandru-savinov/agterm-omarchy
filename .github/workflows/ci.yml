name: ARM historical reconnect diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arm-reconnect-historical-diagnostics-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  LINUX_SOURCEKIT_LIB_PATH: /usr/lib/libsourcekitdInProc.so
jobs:
  diagnostic:
    runs-on: ubuntu-24.04-arm
    container: swift:6.3.2-noble
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install GTK4, accessibility, software GL, test shells, and zig
        env:
          BUILD_ARCH: aarch64
          ZIG_SHA256: ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17
        run: |
          scripts/ci-install-ubuntu-deps.sh \
            libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev libepoxy-dev pkg-config git curl ca-certificates xz-utils ncurses-bin \
            ripgrep zsh gcc file at-spi2-core dbus-x11 gir1.2-atspi-2.0 openbox python3-gi xdotool xvfb xauth \
            libatk-bridge2.0-0 libgl1-mesa-dri libegl-mesa0 mesa-utils imagemagick desktop-file-utils
          curl -fsSLo /tmp/zig.tar.xz \
            "https://ziglang.org/download/0.16.0/zig-${BUILD_ARCH}-linux-0.16.0.tar.xz"
          echo "${ZIG_SHA256}  /tmp/zig.tar.xz" | sha256sum --check
          tar -xJf /tmp/zig.tar.xz -C /opt
          echo "/opt/zig-${BUILD_ARCH}-linux-0.16.0" >> "$GITHUB_PATH"
      - name: Record exact source and build inputs
        run: |
          mkdir -p artifacts/diagnostics
          {
            git rev-parse HEAD
            git rev-parse HEAD^
            git rev-parse 2d1f2f0db6d6ced9eb7f0d2a0726b3c39abbdd2b
            git diff 2d1f2f0db6d6ced9eb7f0d2a0726b3c39abbdd2b HEAD -- agterm-linux agtermCore .github/workflows/ci.yml
            git status --short
            swift --version
            zig version
            sha256sum scripts/setup-linux.sh linux/ghostty-resources.env linux/zmx.env \
              linux/patches/*.patch scripts/zmx-patches/*.patch scripts/zmx-patches/ghostty/*.patch agterm-linux/tests/atspi_smoke.py scripts/test-linux-ui*.sh scripts/test-linux-ui-parallel.py
          } | tee artifacts/diagnostics/source.txt
      - name: Build fresh pinned runtimes without cache reuse
        run: |
          scripts/setup-linux.sh
          scripts/verify-linux-vendor-cache.sh agterm-linux/vendor/ghostty
          scripts/verify-linux-zmx-cache.sh agterm-linux/vendor/zmx
      - name: Build diagnostic application and control client
        run: |
          swift build --package-path agterm-linux --product AgtermLinux --jobs 2
          swift build --package-path agterm-linux --product agtermctl-linux --jobs 2
          sha256sum agterm-linux/.build/debug/AgtermLinux agterm-linux/.build/debug/agtermctl-linux \
            agterm-linux/vendor/ghostty/lib/libghostty.so agterm-linux/vendor/zmx/zmx \
            | tee artifacts/diagnostics/binaries.txt
      - name: Observe at most three fresh remote-presentation cases
        timeout-minutes: 11
        run: |
          for trial in 1 2 3; do
            trial_dir="$GITHUB_WORKSPACE/artifacts/diagnostics/trial-$trial"
            mkdir -p "$trial_dir/wrapper"
            chmod 700 "$trial_dir/wrapper"
            code=0
            timeout --kill-after=10s 180s env PYTHONUNBUFFERED=1 AGTERM_ATSPI_SCENARIO=remote-presentation \
              AGTERM_DIAG357_DIR="$trial_dir/wrapper" AGTERM_UI_ARTIFACT_DIR="$trial_dir/linux-ui" \
              scripts/test-linux-ui.sh >"$trial_dir/runner.log" 2>&1 || code=$?
            cat "$trial_dir/runner.log"
            printf '%s %s\n' "$trial" "$code" | tee -a artifacts/diagnostics/results.txt
            if [[ "$code" != 0 ]]; then exit "$code"; fi
          done
      - name: Upload observations only
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: arm-reconnect-historical-diagnostics-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/diagnostics
          if-no-files-found: warn
          retention-days: 14
