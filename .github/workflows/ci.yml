name: Omarchy CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, omarchy]

  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_BASE_TAG: "v0.35.1"
  UPSTREAM_BASE_COMMIT: "ca50a8ee09ba3cc9315ad3d597e1783e64c6f298"
  SWIFTLINT_VERSION: "0.65.0"
  SWIFTLINT_SHA256: "79306a34e5c7cc55a220cd108cbb861dcad5f10138dcdf261e2624ae8b0a486b"
  LINUX_SOURCEKIT_LIB_PATH: "/usr/lib/libsourcekitdInProc.so"
  ZIG_SHA256: "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"

jobs:
  scripts:
    name: Installer and scripts
    runs-on: ubuntu-24.04
    container: ghcr.io/alexandru-savinov/agterm-omarchy-build-x86_64@sha256:e2d48733b2fd8481c314bd639fd15e523110e106418cb982cc830a7e620a839f
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare unprivileged regression user
        run: |
          useradd --create-home --user-group agterm-test
          chown -R agterm-test:agterm-test "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          for command in python3 rg shellcheck file; do command -v "$command"; done
      - name: Shell syntax and lint
        shell: runuser --user agterm-test -- env HOME=/home/agterm-test bash --noprofile --norc -eo pipefail {0}
        run: |
          scripts=(
            scripts/ci-install-ubuntu-deps.sh
            scripts/check-linux-core-boundary.sh
            scripts/install-linux.sh
            scripts/package-linux.sh
            scripts/run-linux.sh
            scripts/setup-linux.sh
            scripts/setup-omarchy.sh
            scripts/stage-linux.sh
            scripts/test-linux-resources.sh
            scripts/test-linux-ghostty-shutdown.sh
            scripts/test-omarchy.sh
            scripts/test-zig-build-linux.sh
            scripts/verify-linux-packages.sh
            scripts/verify-linux-zmx-cache.sh
            scripts/zig-build-linux.sh
            linux/swift-env.sh
          )
          for script in "${scripts[@]}"; do
            bash -n "$script"
            exclusions=()
            if [[ "$script" == scripts/setup-linux.sh ]]; then
              # Each build subshell explicitly sets all three cache paths; no value leaks between them.
              exclusions=(-e "SC2030,SC2031")
            fi
            shellcheck -x -P SCRIPTDIR "${exclusions[@]}" "$script"
          done
      - name: Full Python helper regression suite
        shell: runuser --user agterm-test -- env HOME=/home/agterm-test bash --noprofile --norc -eo pipefail {0}
        # Discover new modules automatically. Real-zmx cases run after the matrix build below.
        run: python3 -I -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Zig transport fallback regression tests
        shell: runuser --user agterm-test -- env HOME=/home/agterm-test bash --noprofile --norc -eo pipefail {0}
        run: scripts/test-zig-build-linux.sh
      - name: Pinned Ghostty shutdown regression and original-queue negative control
        timeout-minutes: 5
        shell: runuser --user agterm-test -- env HOME=/home/agterm-test bash --noprofile --norc -eo pipefail {0}
        run: |
          source linux/ghostty-resources.env
          source_dir="$(mktemp -d)"
          trap 'rm -rf "$source_dir"' EXIT
          git init -q "$source_dir"
          git -C "$source_dir" fetch --depth 1 --no-tags https://github.com/ghostty-org/ghostty.git "$GHOSTTY_REV"
          scripts/test-linux-ghostty-shutdown.sh "$source_dir"
      - name: Whitespace
        run: git diff --check
      - name: Summary
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          printf '### Installer and scripts\nResult: %s\n' "$RESULT" >> "$GITHUB_STEP_SUMMARY"

  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      swift: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.swift == 'true' }}
      cookbook: ${{ steps.filter.outputs.cookbook }}
      # GitHub caps PR file lists at 3000; an incomplete list must retain full validation.
      ui_python_only: ${{ github.event_name == 'pull_request' && steps.filter.outputs.ui_python_count > 0 && steps.filter.outputs.all_changed_count < 3000 && steps.filter.outputs.ui_python_count == steps.filter.outputs.all_changed_count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          filters: |
            all_changed:
              - "**"
            ui_python:
              - "agterm-linux/tests/*.py"
            swift:
              - "**/*.swift"
              - "agtermCore/**"
              - "agterm/**"
              - "agterm-linux/**"
              # The agent skill and its plugin manifests are test inputs.
              - "plugins/**"
              - ".claude-plugin/**"
              - ".agents/**"
              - "linux/**"
              - "packaging/linux/**"
              - "project.yml"
              - "scripts/**"
              - ".swiftlint.yml"
              - "agtermTests/.swiftlint.yml"
              - "agtermUITests/.swiftlint.yml"
              - ".github/workflows/ci.yml"
              - ".github/workflows/release-linux.yml"
            cookbook:
              - "cookbook/**"
              - ".github/workflows/ci.yml"

  test-linux:
    name: Core tests (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Keep the shared, host-free controller package green on Linux because it backs the GTK frontend.
    container: swift:6.3.2-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install test shell
        run: |
          scripts/ci-install-ubuntu-deps.sh ripgrep zsh fish
      - name: Install Node for OpenCode hook tests
        if: needs.changes.outputs.ui_python_only != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Materialize and verify upstream boundary tag
        run: |
          git tag --force "$UPSTREAM_BASE_TAG" "$UPSTREAM_BASE_COMMIT"
          git merge-base --is-ancestor "$UPSTREAM_BASE_TAG" HEAD
      # Two persistence tests deliberately verify write failures through POSIX directory permissions.
      # The official Swift container runs as root, which bypasses those permissions, so exercise the
      # package as an ordinary desktop user like the application itself.
      - name: swift test as an unprivileged user
        if: needs.changes.outputs.ui_python_only != 'true'
        working-directory: agtermCore
        run: |
          useradd --create-home --user-group agterm-test
          chown -R agterm-test:agterm-test "$GITHUB_WORKSPACE"
          runuser --user agterm-test -- env HOME=/home/agterm-test /usr/bin/env which node
          runuser --user agterm-test -- env HOME=/home/agterm-test node -e '
            const [major, minor] = process.versions.node.split(".").map(Number);
            if (!(major > 22 || (major === 22 && minor >= 7) || (major === 20 && minor >= 19))) {
              throw new Error("Core hook tests require Node 22.7+ or Node 20.19+");
            }
          '
          runuser --user agterm-test -- env HOME=/home/agterm-test /usr/bin/fish --version
          runuser --user agterm-test -- env HOME=/home/agterm-test swift test --no-parallel
      - name: Enforce host-free core boundary
        run: scripts/check-linux-core-boundary.sh "$UPSTREAM_BASE_TAG"
      - name: Reject Linux CLI parser drift
        run: scripts/check-linux-cli-drift.sh

  lint-linux:
    name: SwiftLint (Linux)
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: ubuntu-24.04
    container: ghcr.io/alexandru-savinov/agterm-omarchy-build-x86_64@sha256:e2d48733b2fd8481c314bd639fd15e523110e106418cb982cc830a7e620a839f
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Verify SwiftLint
        run: |
          test "$(swiftlint version)" = "$SWIFTLINT_VERSION"
      - name: swiftlint (strict)
        if: needs.changes.outputs.ui_python_only != 'true'
        run: swiftlint lint --strict --quiet
      - name: Materialize and verify upstream boundary tag
        run: |
          git tag --force "$UPSTREAM_BASE_TAG" "$UPSTREAM_BASE_COMMIT"
          git merge-base --is-ancestor "$UPSTREAM_BASE_TAG" HEAD
      - name: Reject whitespace errors
        run: |
          git diff --check
          git diff --check "$UPSTREAM_BASE_TAG"...HEAD

      # This historical release fixture deliberately asserts the upstream repository name.
      - name: Test published-release verifier
        run: env -u GITHUB_REPOSITORY scripts/test-published-linux-release.sh

  build-linux:
    name: GTK build and tests (${{ matrix.arch }})
    # Independent checks run concurrently; the final CI gate still requires every result.
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            container: ghcr.io/alexandru-savinov/agterm-omarchy-build-x86_64@sha256:e2d48733b2fd8481c314bd639fd15e523110e106418cb982cc830a7e620a839f
          - arch: aarch64
            runner: ubuntu-24.04-arm
            container: swift:6.3.2-noble
            zig-sha256: ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # Only x86_64 has a verified published build image; ARM retains signed package provisioning.
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Verify pinned GTK build image
        if: matrix.arch == 'x86_64'
        run: /usr/local/bin/agterm-build-image-probe
      - name: Install GTK4, accessibility, software GL, test shells, and zig
        if: matrix.arch == 'aarch64'
        env:
          BUILD_ARCH: ${{ matrix.arch }}
          ZIG_SHA256: ${{ matrix.zig-sha256 }}
        run: |
          scripts/ci-install-ubuntu-deps.sh \
            libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev libepoxy-dev pkg-config git curl ca-certificates xz-utils ncurses-bin \
            ripgrep zsh gcc file at-spi2-core dbus-x11 gir1.2-atspi-2.0 openbox python3-gi xdotool xvfb xauth \
            libatk-bridge2.0-0 libgl1-mesa-dri libegl-mesa0 mesa-utils imagemagick desktop-file-utils
          curl -fsSLo /tmp/zig.tar.xz \
            "https://ziglang.org/download/0.16.0/zig-${BUILD_ARCH}-linux-0.16.0.tar.xz"
          echo "${ZIG_SHA256}  /tmp/zig.tar.xz" | sha256sum --check
          tar -xJf /tmp/zig.tar.xz -C /opt
          echo "/opt/zig-${BUILD_ARCH}-linux-0.16.0" >> "$GITHUB_PATH"
      - name: Materialize and verify upstream boundary tag
        run: |
          git tag --force "$UPSTREAM_BASE_TAG" "$UPSTREAM_BASE_COMMIT"
          git merge-base --is-ancestor "$UPSTREAM_BASE_TAG" HEAD
      - name: Enforce host-free core boundary and CLI sharing
        run: |
          scripts/check-linux-core-boundary.sh "$UPSTREAM_BASE_TAG"
          scripts/check-linux-cli-drift.sh
      - name: Test Linux architecture verification
        run: scripts/test-linux-architecture.sh
      - name: Resolve Linux architecture
        id: linux-architecture
        shell: bash
        run: |
          source linux/arch.sh
          echo "host=$HOST_ARCH" >> "$GITHUB_OUTPUT"
      - name: Restore vendored Linux runtimes
        id: ghostty-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            agterm-linux/vendor/ghostty
            agterm-linux/vendor/zmx
          key: linux-runtimes-${{ steps.linux-architecture.outputs.host }}-${{ hashFiles('scripts/setup-linux.sh', 'scripts/verify-linux-vendor-cache.sh', 'scripts/verify-linux-zmx-cache.sh', 'scripts/verify-linux-architecture.sh', 'scripts/verify-linux-resources.sh', 'scripts/linux-notices.py', 'packaging/linux/notices/**', 'scripts/zmx-patches/**/*.patch', 'linux/arch.sh', 'linux/ghostty-resources.env', 'linux/zmx.env', 'linux/patches/ghostty-embedded-opengl.patch', 'linux/patches/ghostty-embedded-input-handoff.patch', 'linux/patches/ghostty-lib-resources.patch', 'linux/patches/ghostty-clipboard-request-kind.patch', 'linux/patches/ghostty-surface-env-unset.patch') }}
      - name: Verify restored libghostty cache
        if: steps.ghostty-cache.outputs.cache-hit == 'true'
        run: scripts/verify-linux-vendor-cache.sh agterm-linux/vendor/ghostty
      - name: Verify restored zmx cache
        if: steps.ghostty-cache.outputs.cache-hit == 'true'
        run: scripts/verify-linux-zmx-cache.sh agterm-linux/vendor/zmx
      - name: Test deterministic Ghostty resources
        run: scripts/test-linux-resources.sh
      - name: Build libghostty (skips if the cache restored it)
        run: scripts/setup-linux.sh
      - name: Verify built libghostty cache
        run: scripts/verify-linux-vendor-cache.sh agterm-linux/vendor/ghostty
      - name: Verify built zmx cache
        run: scripts/verify-linux-zmx-cache.sh agterm-linux/vendor/zmx
      - name: Save verified Linux runtimes
        if: steps.ghostty-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            agterm-linux/vendor/ghostty
            agterm-linux/vendor/zmx
          key: ${{ steps.ghostty-cache.outputs.cache-primary-key }}
      - name: Real zmx identity and cleanup controls
        env:
          AGTERM_IDENTITY_TEST_ZMX: ${{ github.workspace }}/agterm-linux/vendor/zmx/zmx
        run: |
          # Fail if unavailable rather than letting the integration cases silently skip.
          test -x "$AGTERM_IDENTITY_TEST_ZMX"
          python3 -I -m unittest discover -s scripts/tests -p 'test_omarchy_identity.py' -v
          # Restore pre-fill: a line typed without a newline into a new daemon's shell waits for Enter.
          command -v zsh
          python3 -I -m unittest discover -s scripts/tests -p 'test_zmx_prefill.py' -v
      - name: swift test (agterm-linux)
        working-directory: agterm-linux
        run: swift test
      - name: GTK clipboard dialog disposal
        working-directory: agterm-linux
        run: AGTERM_GTK_TESTS=1 xvfb-run -a swift test --skip-build --filter ClipboardPromptGTKTests
      - name: GTK zoom restoration callback tests
        working-directory: agterm-linux
        run: |
          fixture_root=$(mktemp -d)
          trap 'rm -rf "$fixture_root"' EXIT
          mkdir -p "$fixture_root"/{home,state,config,data,cache,runtime}
          chmod 700 "$fixture_root/runtime"
          xvfb-run -a dbus-run-session -- env AGTERM_GTK_TESTS=1 GDK_BACKEND=x11 \
            HOME="$fixture_root/home" AGTERM_STATE_DIR="$fixture_root/state" \
            XDG_CONFIG_HOME="$fixture_root/config" XDG_DATA_HOME="$fixture_root/data" \
            XDG_CACHE_HOME="$fixture_root/cache" XDG_RUNTIME_DIR="$fixture_root/runtime" \
            swift test --skip-build --filter ZoomExitRatioGTKTests
      - name: GTK pending spawn teardown
        working-directory: agterm-linux
        run: |
          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT
          HOME="$fixture" XDG_CONFIG_HOME="$fixture/config" AGTERM_STATE_DIR="$fixture/state" \
            AGTERM_GHOSTTY_RESOURCES="$PWD/vendor/ghostty/share/ghostty" AGTERM_GTK_TESTS=1 \
            xvfb-run -a swift test --skip-build --filter LinuxSpawnRegistryGTKTests
      - name: swift build (agterm-linux)
        working-directory: agterm-linux
        run: swift build
      - name: swift build Release/WMO (agterm-linux)
        working-directory: agterm-linux
        run: swift build -c release
      - name: Validate staged Linux payload
        run: scripts/stage-linux.sh "$RUNNER_TEMP/agterm-stage"
      - name: GTK inline rename effect tests
        working-directory: agterm-linux
        run: |
          fixture_root=$(mktemp -d)
          trap 'rm -rf "$fixture_root"' EXIT
          mkdir -p "$fixture_root"/{home,state,config,data,cache,runtime}
          chmod 700 "$fixture_root/runtime"
          xvfb-run -a dbus-run-session -- env AGTERM_RENAME_GTK_TESTS=1 GDK_BACKEND=x11 \
            HOME="$fixture_root/home" AGTERM_STATE_DIR="$fixture_root/state" \
            XDG_CONFIG_HOME="$fixture_root/config" XDG_DATA_HOME="$fixture_root/data" \
            XDG_CACHE_HOME="$fixture_root/cache" XDG_RUNTIME_DIR="$fixture_root/runtime" \
            swift test --skip-build --filter InlineRenameGTKTests
      - name: GTK AT-SPI smoke tests
        env:
          AGTERM_UI_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/linux-ui
        run: python3 scripts/test-linux-ui-parallel.py
      - name: Upload GTK diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: linux-ui-diagnostics-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/linux-ui
          if-no-files-found: warn
      - name: Archive complete runtime payload
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: tar -czf "$RUNNER_TEMP/agterm-omarchy-${BUILD_ARCH}.tar.gz" -C "$RUNNER_TEMP" agterm-stage
      - name: Upload tested runtime payload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: agterm-omarchy-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/agterm-omarchy-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Build summary
        if: always()
        env:
          BUILD_ARCH: ${{ matrix.arch }}
          RESULT: ${{ job.status }}
        run: |
          printf '### Linux %s\nResult: %s\n\nSwift 6.3.2; Zig 0.16.0. GTK tests use Xvfb.\n' "$BUILD_ARCH" "$RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo 'Native Hyprland/Wayland validation remains a separate Omarchy VM check.' >> "$GITHUB_STEP_SUMMARY"

  ci:
    name: CI
    # Superseded runs must not hold the concurrency slot while this job waits for a runner.
    if: ${{ !cancelled() }}
    needs: [scripts, changes, test-linux, lint-linux, build-linux, cookbook]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, value in results.items() if value['result'] not in ('success', 'skipped')]
          if failed:
              raise SystemExit('Failed or cancelled checks: ' + ', '.join(failed))
          PYTHON

  cookbook:
    name: Cookbook checks
    needs: changes
    if: needs.changes.outputs.cookbook == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: recipe layout, index and headings
        # bash explicitly: the block below uses process substitution, and pipefail
        # is what makes a failed find in a command substitution red the step
        shell: bash
        run: |
          fail=0

          # directory set vs index set, BOTH directions
          dirs=$(find cookbook -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort)
          # links come ONLY from canonical table rows, so a link in prose, an html
          # comment or a fenced example cannot satisfy the check
          links=$(grep -E '^\|' cookbook/README.md 2>/dev/null \
                  | grep -oE '\]\([a-z0-9][a-z0-9-]*/\)' \
                  | sed -e 's/^](//' -e 's|/)$||' | sort -u || true)
          missing=$(comm -23 <(printf '%s\n' "$dirs") <(printf '%s\n' "$links"))
          stale=$(comm -13 <(printf '%s\n' "$dirs") <(printf '%s\n' "$links"))
          for n in $missing; do echo "::error::$n is missing from the index"; fail=1; done
          for n in $stale;   do echo "::error::index row '$n' points at no such directory"; fail=1; done

          for d in cookbook/*/; do
            [ -d "$d" ] || continue
            name=$(basename "$d")
            if printf '%s' "$name" | grep -qE '[^a-z0-9-]|--|^-|-$'; then
              echo "::error::$name is not kebab-case"; fail=1
            fi
            if [ ! -f "$d/README.md" ]; then
              echo "::error::$name has no README.md"; fail=1; continue
            fi
            for h in "## What it does" "## Requirements" "## Setup" \
                     "## Usage" "## How it works" "## Limits"; do
              if ! grep -qxF "$h" "$d/README.md"; then
                echo "::error::$name README is missing the '$h' heading"; fail=1
              fi
            done
          done

          # every script carries a shebang
          while IFS= read -r -d '' f; do
            if ! head -c 2 "$f" | grep -q '#!'; then
              echo "::error::$f has no shebang"; fail=1
            fi
          done < <(find cookbook -type f \( -name '*.sh' -o -name '*.zsh' -o -name '*.fish' -o -name '*.py' \) -print0)

          exit $fail
      - name: shellcheck
        # bash explicitly, for pipefail: xargs -0 -r exits 0 on empty input, so
        # without it a failed find would leave the step green having checked nothing
        shell: bash
        run: find cookbook -type f -name '*.sh' -print0 | xargs -0 -r shellcheck
      - name: Install recipe shells
        # fish runs a recipe regression test as well as syntax checks.
        run: sudo scripts/ci-install-ubuntu-deps.sh zsh fish
      - name: zsh syntax check
        # shellcheck cannot parse zsh, so a parse is the only gate .zsh recipes get.
        # -n1 because zsh -n reads one script and treats the rest as its arguments;
        # bash explicitly, for pipefail, same reason as the shellcheck step above
        shell: bash
        run: find cookbook -type f -name '*.zsh' -print0 | xargs -0 -r -n1 zsh -n
      - name: fish syntax check
        # nothing lints .fish either, so a parse is the only gate these recipes get.
        # -n1 because fish --no-execute parses its first argument and ignores the rest,
        # so a batched call would leave the step green having checked one file
        shell: bash
        run: find cookbook -type f -name '*.fish' -print0 | xargs -0 -r -n1 fish --no-execute
      - name: Install ruff
        # not on the ubuntu-latest image, unlike shellcheck. pipx, because the runner's
        # python is externally managed and a bare pip install into it fails
        run: pipx install ruff==0.17.3
      - name: ruff
        # the .py counterpart of shellcheck, so a recipe is linted rather than only parsed.
        # EXE001 is ignored because it fails a shebang on a non-executable file, which
        # collides head-on with the shebang the layout step requires of every script, and
        # would move executable-bit policy into CI where this repo deliberately keeps it
        # out. bash explicitly, for pipefail, same reason as the shellcheck step above
        shell: bash
        # Recipes include Python 3.10 code and explicit 3.9 compatibility; do not require 3.11 APIs.
        run: find cookbook -type f -name '*.py' -print0 | xargs -0 -r ruff check --target-version py310 --ignore EXE001
      - name: Python recipe tests
        # one process per file keeps recipes independent and gives each test script its own argv.
        # bash explicitly, for pipefail, same reason as the ruff step above.
        shell: bash
        run: find cookbook -type f -name 'test_*.py' -print0 | xargs -0 -r -n1 python3
