name: Upstream sync schedule liveness

on:
  schedule:
    - cron: '47 */3 * * *'
  push:
    branches: [main]

permissions: {}

concurrency:
  group: upstream-sync-liveness
  cancel-in-progress: false

jobs:
  check:
    name: Check upstream sync schedule
    if: github.repository == 'alexandru-savinov/agterm-omarchy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reconcile the schedule alarm
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/upstream-sync-liveness.py
