name: x86_64 Omarchy native gates

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: probe
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - name: Host
        run: |
          uname -a; nproc; cat /etc/os-release | head -3
          which shellcheck docker gpgv gpg || true
          ls -l /dev/dri || true
          sudo modprobe vkms && echo VKMS_OK || echo VKMS_FAIL
          if ! lsmod | grep -q vkms; then
            sudo apt-get update -qq
            apt-cache policy "linux-modules-extra-$(uname -r)" || true
            sudo apt-get install -y "linux-modules-extra-$(uname -r)" && sudo modprobe vkms && echo VKMS_EXTRA_OK || echo VKMS_EXTRA_FAIL
          fi
          find /lib/modules/$(uname -r) -name 'vkms*' || true
          ls -l /dev/dri || true
          for card in /sys/class/drm/card[0-9]; do echo "$card -> $(readlink -f "$card/device")"; done
      - name: ALARM tarball
        run: |
          cd "$RUNNER_TEMP"
          time curl -fsSL --retry 3 -o alarm.tar.gz http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz
          curl -fsSL --retry 3 -o alarm.tar.gz.sig http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz.sig
          ls -l alarm.tar.gz*; sha256sum alarm.tar.gz
          curl -fsS -o key.asc 'https://keyserver.ubuntu.com/pks/lookup?op=get&options=mr&search=0x68B3537F39A313B3E574D06777193F152BDBE6A6'
          gpg --show-keys --with-colons key.asc | grep -E '^(pub|sub|fpr)'
          gpg --dearmor < key.asc > key.gpg
          gpgv --keyring "$PWD/key.gpg" alarm.tar.gz.sig alarm.tar.gz && echo SIG_OK
          time docker import --platform linux/arm64 alarm.tar.gz alarm:probe
          docker run --rm alarm:probe bash -c 'getent passwd 1000; pacman -Q | grep -E "^(linux|firmware|mkinitcpio|uboot)" ; pacman -Q | wc -l; cat /etc/pacman.d/mirrorlist | grep -v "^#" | head; ls /etc/pacman.d/gnupg | head'
      - name: Container pacman
        run: |
          docker run --rm --device /dev/dri alarm:probe bash -c '
            set -e
            pacman-key --init >/dev/null; pacman-key --populate archlinuxarm >/dev/null
            pacman -Rdd --noconfirm $(pacman -Qq | grep -E "^(linux-aarch64|linux-firmware.*)$") || true
            time pacman -Syu --noconfirm >/tmp/syu.log 2>&1 || { tail -40 /tmp/syu.log; exit 1; }
            tail -5 /tmp/syu.log
            for p in hyprland hyprland-guiutils uwsm yaru-icon-theme ttf-jetbrains-mono-nerd webkitgtk-6.0 gtk4 libadwaita mesa xdg-terminal-exec swayosd waybar; do pacman -Si $p 2>/dev/null | grep -E "^(Name|Version)" | tr "\n" " "; echo " <$p"; done
          '
