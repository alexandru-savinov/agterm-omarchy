name: actionlint

# Lints GitHub Actions workflows (syntax, expressions, runner labels, inline shell via
# the runner's shellcheck). MIT, no account or key. The binary is downloaded and
# verified against a pinned sha256, as ci.yml does for SwiftLint, so no allowlist change.
on:
  pull_request:
    paths: ['.github/workflows/**']
  push:
    branches: [main]
    paths: ['.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

jobs:
  actionlint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install actionlint
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "/tmp/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  /tmp/${archive}" | sha256sum --check
          tar -xzf "/tmp/${archive}" -C /tmp actionlint
      - name: Self-test (actionlint must reject a known-bad workflow)
        run: |
          set -euo pipefail
          # The bad expression is assembled at runtime, so this file holds no
          # literal expression for the runner to interpolate.
          d='$'
          printf 'on: push\njobs:\n  bad:\n    runs-on: ubuntu-24.04\n    steps:\n      - run: echo "%s{{ github.no_such_context_xyz }}"\n' "$d" > /tmp/bad.yml
          cat /tmp/bad.yml
          if /tmp/actionlint -no-color /tmp/bad.yml; then
            echo "actionlint accepted a known-bad workflow; this check cannot fail" >&2
            exit 1
          fi
      - name: Run actionlint
        run: /tmp/actionlint -color
