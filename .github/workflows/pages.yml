name: Omarchy hub Pages

on:
  push:
    branches: [main]
    paths: ['docs/omarchy-pages/**', '.github/workflows/pages.yml']
  pull_request:
    branches: [main]
    paths: ['docs/omarchy-pages/**', '.github/workflows/pages.yml']
  schedule:
    # Refresh claim ages and stale flags on the team page (queue feeds Pages, #73).
    - cron: '47 * * * *'
  workflow_dispatch:
    inputs:
      task_limit:
        description: Number of tasks to show in the refreshed issue snapshot
        type: choice
        options: ['10', '25', '50', '100']
        default: '100'
      deploy:
        description: Deploy after building (main branch only); otherwise upload a preview
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test hub
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      # Download the upstream-drift artifact of another run (read-only).
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test escaping, readiness, and issue selection
        run: python3 docs/omarchy-pages/test_build.py
      - name: Snapshot the public task queue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=100" > "$RUNNER_TEMP/issues.json"
      - name: Snapshot agent claims with the queue parser
        # Same parser as the Agent queue workflow. If it fails, the site still builds without the overlay
        # and build.py marks the queue snapshot as unavailable on the page and in status.json.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/github/queue.py --output "$RUNNER_TEMP/queue"
      - name: Snapshot upstream drift from the latest weekly run
        # If no run or artifact is found, build.py renders a visible "unavailable" notice and status.json says so;
        # older than 8 days renders a "stale" notice. Only scheduled/dispatched runs on main count, never PR runs
        # (a fork's PR branch can be named main); build.py applies the same filter to the selected run.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/drift"
          # Filter by event on the server, so newer PR runs can never push an eligible run past --limit.
          for event in schedule workflow_dispatch; do
            gh run list --repo "$GITHUB_REPOSITORY" --workflow upstream-drift.yml --branch main --status success \
              --event "$event" --limit 5 --json databaseId,createdAt,event,headBranch
          done | jq -s '[add | map(select(.headBranch == "main" and (.event == "schedule" or .event == "workflow_dispatch")))
                        | sort_by(.createdAt) | last | select(. != null)]' > "$RUNNER_TEMP/drift/run.json"
          run_id="$(jq -r '.[0].databaseId // empty' "$RUNNER_TEMP/drift/run.json")"
          if [[ -z "$run_id" ]]; then echo 'No successful scheduled/dispatched upstream-drift run on main.'; exit 0; fi
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name upstream-drift --dir "$RUNNER_TEMP/drift/artifact"
      - name: Build static site
        env:
          TASK_LIMIT: ${{ inputs.task_limit || '100' }}
        run: |
          python3 docs/omarchy-pages/build.py --issues "$RUNNER_TEMP/issues.json" \
            --queue "$RUNNER_TEMP/queue/queue.json" \
            --drift-run "$RUNNER_TEMP/drift/run.json" --drift "$RUNNER_TEMP/drift/artifact/upstream-drift.json" \
            --output _site --commit "$GITHUB_SHA" --limit "$TASK_LIMIT"
      - name: Upload downloadable preview
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: omarchy-hub-preview-${{ github.sha }}
          path: _site
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site
      - name: Build summary
        run: |
          {
            printf '### Omarchy hub preview\nSource: %s\n\nReadiness: **work in progress**.\n' "$GITHUB_SHA"
            echo 'The preview artifact contains index.html, style.css, and the task snapshot status.json.'
            echo 'This documentation build does not certify native terminal readiness.'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy public hub
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || inputs.deploy)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Deploy reviewed artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
      - name: Verify public deployment content
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          url = os.environ['PAGE_URL'].rstrip('/') + '/status.json?commit=' + os.environ['GITHUB_SHA']
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(url, timeout=10) as response:
                      status = json.load(response)
                  assert status['repository'] == os.environ['GITHUB_REPOSITORY']
                  assert status['commit'] == os.environ['GITHUB_SHA']
                  assert status['readiness'] == 'work-in-progress'
                  break
              except (OSError, ValueError, AssertionError):
                  if attempt == 11:
                      raise
                  time.sleep(5)
          print('Verified public HTTPS snapshot:', url)
          PY
      - name: Deployment summary
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: printf '### Published hub\n[%s](%s)\n\nThe public snapshot matches %s.\n' "$PAGE_URL" "$PAGE_URL" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
