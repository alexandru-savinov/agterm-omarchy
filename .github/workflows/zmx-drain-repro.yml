name: zmx drain repro

# One-off measurement for #380: does the zmx inside upstream's released macOS app lose a session's last
# output line when the session ends, and does the fork's patched zmx keep it? Runs only on its own branch.
on:
  push:
    branches: [ci/zmx-drain-repro]

permissions:
  contents: read

concurrency:
  group: zmx-drain-repro-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_TAG: v0.42.3
  RUNS: '30'

jobs:
  repro:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record identity
        run: |
          mkdir -p logs
          { git rev-parse HEAD; sw_vers; uname -m; python3 --version; } | tee logs/identity.log
      - name: Extract zmx from upstream's released app
        run: |
          version="${UPSTREAM_TAG#v}"
          curl -fsSL -o agterm.dmg "https://github.com/umputun/agterm/releases/download/${UPSTREAM_TAG}/agterm-${version}.dmg"
          shasum -a 256 agterm.dmg | tee logs/upstream-dmg.log
          mnt="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" agterm.dmg
          app="$(find "$mnt" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app"
          defaults read "$app/Contents/Info.plist" CFBundleShortVersionString | tee -a logs/upstream-dmg.log
          defaults read "$app/Contents/Info.plist" CFBundleVersion | tee -a logs/upstream-dmg.log
          zmx="$(find "$app" -type f -name zmx -perm -u+x -print -quit)"
          test -n "$zmx"
          echo "$zmx" | tee -a logs/upstream-dmg.log
          mkdir -p arms/upstream
          cp "$zmx" arms/upstream/zmx
          hdiutil detach "$mnt"
          { shasum -a 256 arms/upstream/zmx; arms/upstream/zmx version; } | tee logs/upstream-zmx.log
      - name: Build the fork's patched zmx
        run: |
          scripts/setup.sh --zmx-only 2>&1 | tee logs/fork-setup.log
          mkdir -p arms/fork
          cp agterm/Resources/zmx/zmx arms/fork/zmx
          { cat .zmx-build-stamp; shasum -a 256 arms/fork/zmx; arms/fork/zmx version; } | tee logs/fork-zmx.log
      # upstream's own source and patch set at the release tag, plus only the fork's drain patch on top,
      # built by upstream's own setup.sh: the change a PR would propose, isolated from the fork's other patches.
      - name: Build upstream's zmx with only the drain patch added
        run: |
          git clone -q --depth 1 --branch "$UPSTREAM_TAG" https://github.com/umputun/agterm.git up
          git -C up rev-parse HEAD | tee logs/updrain-source.log
          cp scripts/zmx-patches/0005-drain-output-before-exit.patch up/scripts/zmx-patches/0099-drain-output-before-exit.patch
          ls up/scripts/zmx-patches | tee -a logs/updrain-source.log
          (cd up && scripts/setup.sh --zmx-only) 2>&1 | tee logs/updrain-setup.log
          mkdir -p arms/updrain
          cp up/agterm/Resources/zmx/zmx arms/updrain/zmx
          { cat up/.zmx-build-stamp; shasum -a 256 arms/updrain/zmx; arms/updrain/zmx version; } | tee logs/updrain-zmx.log
      - name: Run the scenario on every arm
        run: |
          for config in fast:200000 stall:200000 stall:20000 slow:200000; do
            reader="${config%%:*}" burst="${config#*:}"
            for arm in upstream updrain fork; do
              python3 -I scripts/zmx-drain-repro.py "arms/$arm/zmx" --runs "$RUNS" --reader "$reader" \
                --burst "$burst" 2>&1 | tee "logs/run-$arm-$reader-$burst.log"
            done
          done
          echo "== summary"
          for f in logs/run-*.log; do echo "$f: $(grep '^RESULT' "$f")"; done | tee logs/summary.log
      - name: Retain logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: zmx-drain-repro-${{ github.run_id }}
          path: logs
          retention-days: 14
