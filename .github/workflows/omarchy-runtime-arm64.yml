name: Omarchy runtime (hosted ARM64 experiment)

# ultra_arm64_runtime, issue #64 (complements #52). Runs an existing trusted aarch64 payload
# on GitHub-hosted ubuntu-24.04-arm: runner CPU identity, bundled zmx natively and under
# qemu-aarch64 CPU models, and the launch/Live path under headless compositors.
# Results are hosted-runner / emulation / software-rendering evidence, not native Omarchy
# hardware acceptance. Builds nothing and publishes nothing.

on:
  pull_request:
    paths:
      - .github/workflows/omarchy-runtime-arm64.yml
      - scripts/ci/omarchy-runtime-arm64/**
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Run id that produced the aarch64 payload artifact
        default: "40957588704"
      artifact_name:
        description: Name of the aarch64 payload artifact in that run
        default: agterm-omarchy-aarch64-fa64d44f37d472bb43acdcd3458d33cb159708dc
      archive_sha256:
        description: Expected sha256 of the .tar.gz inside the artifact
        default: 17bc64248c8f83aadc9ff5cb793c4c1540dc5cbc1ed027bdb211ae414bfaac2a
      harness_ref:
        description: Commit whose scripts/test-omarchy.sh is run unmodified
        default: fa64d44f37d472bb43acdcd3458d33cb159708dc

permissions:
  contents: read
  actions: read

concurrency:
  group: omarchy-runtime-arm64-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_RUN_ID: ${{ inputs.source_run_id || '40957588704' }}
  ARTIFACT_NAME: ${{ inputs.artifact_name || 'agterm-omarchy-aarch64-fa64d44f37d472bb43acdcd3458d33cb159708dc' }}
  ARCHIVE_SHA256: ${{ inputs.archive_sha256 || '17bc64248c8f83aadc9ff5cb793c4c1540dc5cbc1ed027bdb211ae414bfaac2a' }}
  HARNESS_REF: ${{ inputs.harness_ref || 'fa64d44f37d472bb43acdcd3458d33cb159708dc' }}

jobs:
  cpu-zmx:
    name: Runner CPU + bundled zmx (native and qemu CPU models)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Validate inputs
        run: |
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || exit 2
          [[ "$ARTIFACT_NAME" =~ ^[A-Za-z0-9._-]+$ ]] || exit 2
          [[ "$ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]] || exit 2
          [[ "$HARNESS_REF" =~ ^[0-9a-f]{40}$ ]] || exit 2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download trusted payload artifact (cross-run)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/download
      - name: Verify sha256 and extract
        run: bash scripts/ci/omarchy-runtime-arm64/verify-extract.sh "$RUNNER_TEMP/download" "$ARCHIVE_SHA256" "$RUNNER_TEMP/payload" | tee "$RUNNER_TEMP/identity.txt"
      - name: Install qemu-user and gdb
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-user gdb file
      - name: Probe CPU and zmx
        run: |
          out="$RUNNER_TEMP/results/cpu-zmx"
          mkdir -p "$out"
          cp "$RUNNER_TEMP/identity.txt" "$out/"
          bash scripts/ci/omarchy-runtime-arm64/cpu-zmx-probe.sh "$RUNNER_TEMP/payload/agterm-stage/bin/zmx" "$out"
      - name: Job summary
        if: always()
        run: |
          out="$RUNNER_TEMP/results/cpu-zmx"
          {
            echo "### Hosted ARM64 runner: CPU identity and bundled zmx"
            echo "Source run \`$SOURCE_RUN_ID\`, artifact \`$ARTIFACT_NAME\`. Hosted runner and qemu user-mode emulation, not native Omarchy hardware."
            echo '```'
            cat "$RUNNER_TEMP/identity.txt" 2>/dev/null
            grep -A1 -E '^## uname' "$out/cpu.txt" 2>/dev/null | tail -1
            grep -E '^ *[0-9]+ (CPU (implementer|part|variant)|Features)' "$out/cpu.txt" 2>/dev/null
            head -1 "$out/qemu-version.txt" 2>/dev/null
            echo '```'
            echo
            if [[ -f "$out/zmx-results.tsv" ]]; then
              awk -F'\t' 'NR==1{print "| " $1 " | " $2 " | " $3 " | " $4 " | " $5 " |"; print "|---|---|---|---|---|"; next}
                          {gsub(/\|/,"/",$5); print "| " $1 " | " $2 " | " $3 " | " $4 " | " $5 " |"}' "$out/zmx-results.tsv"
            fi
            if [[ -f "$out/fault-decode.txt" ]]; then
              echo; echo "#### Faulting instruction (gdb on qemu guest core)"; echo '```'; head -40 "$out/fault-decode.txt"; echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: omarchy-runtime-arm64-cpu-zmx
          path: ${{ runner.temp }}/results/cpu-zmx
          retention-days: 30
          if-no-files-found: warn

  live-ubuntu:
    name: Launch + Live probe under headless weston (Ubuntu arm64 host)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Validate inputs
        run: |
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || exit 2
          [[ "$ARTIFACT_NAME" =~ ^[A-Za-z0-9._-]+$ ]] || exit 2
          [[ "$ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]] || exit 2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download trusted payload artifact (cross-run)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/download
      - name: Verify sha256 and extract
        run: bash scripts/ci/omarchy-runtime-arm64/verify-extract.sh "$RUNNER_TEMP/download" "$ARCHIVE_SHA256" "$RUNNER_TEMP/payload" | tee "$RUNNER_TEMP/identity.txt"
      - name: Install runtime libraries, weston, qemu-user
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libgtk-4-1 libadwaita-1-0 libwebkitgtk-6.0-4 libjavascriptcoregtk-6.0-1 libsoup-3.0-0 \
            libvulkan1 libepoxy0 libgraphene-1.0-0 libgl1-mesa-dri libegl1 libegl-mesa0 libglx-mesa0 \
            weston dbus dbus-user-session fonts-dejavu-core qemu-user jq
      - name: Run probes
        run: |
          out="$RUNNER_TEMP/results/live-ubuntu"
          mkdir -p "$out"
          cp "$RUNNER_TEMP/identity.txt" "$out/"
          bash scripts/ci/omarchy-runtime-arm64/ubuntu-live.sh "$RUNNER_TEMP/payload/agterm-stage" scripts/ci/omarchy-runtime-arm64 "$out"
      - name: Job summary
        if: always()
        run: |
          out="$RUNNER_TEMP/results/live-ubuntu"
          {
            echo "### Launch + Live probe on hosted ARM64 (Ubuntu 24.04 host, headless weston, software rendering)"
            echo "Compositor-neutral \`live-probe.py\`, not \`scripts/test-omarchy.sh\`; Hyprland-dependent checks NOT RUN here. qemu rows use diagnostic copies whose \`bin/zmx\` wraps the unchanged zmx bytes."
            echo '```'; cat "$RUNNER_TEMP/identity.txt" 2>/dev/null; echo '```'
            [[ -f "$out/status.tsv" ]] && awk -F'\t' 'NR==1{print "| step | result | detail |"; print "|---|---|---|"; next}
                                                   {gsub(/\|/,"/",$3); print "| " $1 " | " $2 " | " $3 " |"}' "$out/status.tsv"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: omarchy-runtime-arm64-live-ubuntu
          path: ${{ runner.temp }}/results/live-ubuntu
          retention-days: 30
          if-no-files-found: warn

  arch-hyprland:
    name: Unmodified harness under headless Hyprland (Arch Linux ARM container)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 55
    steps:
      - name: Validate inputs
        run: |
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || exit 2
          [[ "$ARTIFACT_NAME" =~ ^[A-Za-z0-9._-]+$ ]] || exit 2
          [[ "$ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]] || exit 2
          [[ "$HARNESS_REF" =~ ^[0-9a-f]{40}$ ]] || exit 2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the harness at the pinned commit (read-only use)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HARNESS_REF }}
          path: harness
          persist-credentials: false
          sparse-checkout: scripts/test-omarchy.sh
          sparse-checkout-cone-mode: false
      - name: Download trusted payload artifact (cross-run)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/download
      - name: Verify sha256 and extract
        run: |
          bash scripts/ci/omarchy-runtime-arm64/verify-extract.sh "$RUNNER_TEMP/download" "$ARCHIVE_SHA256" "$RUNNER_TEMP/payload" | tee "$RUNNER_TEMP/identity.txt"
          echo "harness $(git -C harness rev-parse HEAD) scripts/test-omarchy.sh sha256=$(sha256sum harness/scripts/test-omarchy.sh | cut -d' ' -f1)" | tee -a "$RUNNER_TEMP/identity.txt"
      - name: Try a virtual DRM device (vkms/vgem) for Hyprland
        run: |
          out="$RUNNER_TEMP/results/arch-hyprland"; mkdir -p "$out"
          {
            uname -a
            sudo modprobe vkms 2>&1 || { sudo apt-get update -q && sudo apt-get install -y -q "linux-modules-extra-$(uname -r)" && sudo modprobe vkms; } 2>&1 | tail -3
            sudo modprobe vgem 2>&1 || true
            ls -la /dev/dri 2>&1 || echo "no /dev/dri"
          } > "$out/host-drm.txt" 2>&1 || true
          cat "$out/host-drm.txt"
      - name: Fetch and verify the Arch Linux ARM aarch64 rootfs
        env:
          # Arch Linux ARM Build System <builder@archlinuxarm.org>
          ALARM_FPR: 68B3537F39A313B3E574D06777193F152BDBE6A6
        run: |
          d="$RUNNER_TEMP/alarm"; mkdir -p "$d"; cd "$d"
          curl -fsSL --retry 3 -o rootfs.tar.gz http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz
          curl -fsSL --retry 3 -o rootfs.tar.gz.sig http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz.sig
          export GNUPGHOME="$d/gnupg"; mkdir -m 700 "$GNUPGHOME"
          curl -fsSL --retry 3 "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x$ALARM_FPR" | gpg --batch --import
          gpg --batch --status-fd 1 --verify rootfs.tar.gz.sig rootfs.tar.gz > verify.status 2> verify.err || true
          cat verify.err
          grep -E "^\[GNUPG:\] VALIDSIG $ALARM_FPR " verify.status || { echo "::error::Arch Linux ARM rootfs signature did not verify with $ALARM_FPR"; exit 1; }
          echo "alarm rootfs sha256=$(sha256sum rootfs.tar.gz | cut -d' ' -f1) signed-by=$ALARM_FPR $(grep -oE 'SIG_CREATED.*' verify.status | head -1)" | tee -a "$RUNNER_TEMP/identity.txt"
          docker import rootfs.tar.gz ultra-alarm:rootfs
          rm -f rootfs.tar.gz
      - name: Run harness in the container
        run: |
          out="$RUNNER_TEMP/results/arch-hyprland"; mkdir -p "$out"
          cp "$RUNNER_TEMP/identity.txt" "$out/"
          docker run --rm --privileged --network host \
            -v "$RUNNER_TEMP/payload:/payload:ro" -v "$PWD/harness:/harness:ro" \
            -v "$PWD/scripts/ci/omarchy-runtime-arm64:/probe:ro" -v "$out:/out" \
            ultra-alarm:rootfs bash -c 'cp -a /payload/agterm-stage /tmp/stage && cp -a /harness /tmp/harness && cp -a /probe /tmp/probe && bash /tmp/probe/arch-hyprland.sh /tmp/stage /tmp/harness /tmp/probe /out'
      - name: Job summary
        if: always()
        run: |
          out="$RUNNER_TEMP/results/arch-hyprland"
          {
            echo "### Arch Linux ARM container on hosted ARM64: unmodified harness under headless Hyprland"
            echo "Hosted runner, container, software rendering - not native Omarchy hardware. probe-weston rows are the compositor-neutral probe, not the harness."
            echo '```'; cat "$out/identity.txt" 2>/dev/null; cat "$out/os-release.txt" 2>/dev/null; echo '```'
            [[ -f "$out/status.tsv" ]] && awk -F'\t' 'NR==1{print "| step | result | detail |"; print "|---|---|---|"; next}
                                                   {gsub(/\|/,"/",$3); print "| " $1 " | " $2 " | " $3 " |"}' "$out/status.tsv"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: omarchy-runtime-arm64-arch-hyprland
          path: ${{ runner.temp }}/results/arch-hyprland
          retention-days: 30
          if-no-files-found: warn
