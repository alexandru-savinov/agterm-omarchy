name: Relaunch A/B arms for umputun/agterm Discussion 1037

# Helper only, never merged. Builds umputun master (A) and the PR head (B, A plus the ApplePersistenceIgnoreState
# registration) as Debug apps with `make build` and uploads both, so the A/B and the cold link and folder checks run
# on a Mac with exactly these bundles (.github/relaunch-ab-1037/ab-local.sh), then runs the CONTRIBUTING gates at B in
# the same job, since hosted macOS arm64 capacity rarely gives a second job a runner. The file takes the fork's macos-weekly.yml name only because workflow_dispatch needs a name
# registered on the default branch; on this branch it is dispatch-only and the fork's main is untouched.
on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: umputun/agterm master commit (A)
        required: true
      head_sha:
        description: PR head, the base plus the registration commit (B)
        required: true

permissions:
  contents: read

jobs:
  arms:
    runs-on: macos-26
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      BASE_SHA: ${{ inputs.base_sha }}
      HEAD_SHA: ${{ inputs.head_sha }}
    steps:
      - name: Check out umputun/agterm master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: umputun/agterm
          ref: ${{ inputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the patch and record identities
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          git fetch --no-tags https://github.com/alexandru-savinov/agterm-omarchy.git "$HEAD_SHA"
          {
            echo "umputun master now: $(git ls-remote https://github.com/umputun/agterm.git refs/heads/master)"
            echo "A (base): $(git rev-parse "$BASE_SHA")"
            echo "B (head): $(git rev-parse "$HEAD_SHA"), parent $(git rev-parse "$HEAD_SHA^")"
            git diff "$BASE_SHA" "$HEAD_SHA"
            sw_vers; uname -m; xcodebuild -version
          } | tee "$RUNNER_TEMP/out/identity.log"
          test "$(git rev-parse "$HEAD_SHA^")" = "$(git rev-parse "$BASE_SHA")"
      - name: Read pinned helper revisions
        id: revisions
        run: |
          echo "ghostty=$(sed -nE 's/^GHOSTTY_REV="([^"]+)".*/\1/p' scripts/setup.sh)" >> "$GITHUB_OUTPUT"
          echo "zmx=$(sed -nE 's/^ZMX_REV="([^"]+)".*/\1/p' scripts/setup.sh)" >> "$GITHUB_OUTPUT"
          echo "zmx_target=$(sed -nE 's/^ZMX_TARGET="([^"]+)".*/\1/p' scripts/setup.sh)" >> "$GITHUB_OUTPUT"
      # the gates job's keys and paths, so its saved artifacts are reused
      - name: Cache libghostty
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            GhosttyKit.xcframework
            agterm/Resources/ghostty
            agterm/Resources/terminfo
            .ghostty-build-stamp
          key: ab1037-gates-ghosttykit-${{ steps.revisions.outputs.ghostty }}-${{ hashFiles('scripts/ghostty-patches/*.patch') }}
      - name: Cache zmx
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            agterm/Resources/zmx
            .zmx-build-stamp
          key: ab1037-gates-zmx-${{ steps.revisions.outputs.zmx }}-${{ steps.revisions.outputs.zmx_target }}-${{ hashFiles('scripts/zmx-patches/**/*.patch') }}
      - name: Install Node for plugin tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install prerequisites
        run: |
          brew install xcodegen swiftlint fish
          sudo dscl . -create "/Users/$(id -un)" UserShell /bin/zsh
          { xcodegen --version; swiftlint version; fish --version; node --version; } | tee "$RUNNER_TEMP/out/prerequisites.log"
      - name: Stage libghostty and zmx
        run: scripts/setup.sh 2>&1 | tee "$RUNNER_TEMP/out/setup.log"
      - name: Build both arms (Debug, make build)
        run: |
          mkdir -p "$RUNNER_TEMP/arms"
          for arm in master patched; do
            sha=$BASE_SHA; [ "$arm" = patched ] && sha=$HEAD_SHA
            git checkout --quiet --detach "$sha"
            make build 2>&1 | tee "$RUNNER_TEMP/out/build-$arm.log" | tail -3
            app=build/DerivedData/Build/Products/Debug/agterm.app
            # ditto keeps the bundle's symlinks, modes and signatures, which the artifact zip alone would not
            ditto -c -k --keepParent "$app" "$RUNNER_TEMP/arms/agterm-$arm.zip"
            {
              echo "$arm $(git rev-parse HEAD)"
              echo "  zip $(shasum -a 256 "$RUNNER_TEMP/arms/agterm-$arm.zip" | cut -d' ' -f1)"
              (cd "$app/Contents/MacOS" && shasum -a 256 agterm agterm.debug.dylib agtermctl zmx agterm-session-host | sed 's/^/  /')
              echo "  ApplePersistenceIgnoreState in dylib: $(grep -a -c ApplePersistenceIgnoreState "$app/Contents/MacOS/agterm.debug.dylib")"
              codesign -dv "$app" 2>&1 | grep -E '^(Identifier|CDHash|Signature)' | sed 's/^/  /'
            } | tee -a "$RUNNER_TEMP/arms/hashes.txt"
          done
          cp "$RUNNER_TEMP/out/identity.log" "$RUNNER_TEMP/arms/"
          cat "$RUNNER_TEMP/arms/hashes.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload both arms
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ab1037-arms-${{ github.run_id }}
          path: ${{ runner.temp }}/arms
          retention-days: 30
      # B is checked out and built by `make build` above; every gate runs even when another fails
      - name: make test (B)
        if: ${{ !cancelled() }}
        env:
          AGTERM_REQUIRE_FISH: '1'
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          make test 2>&1 | tee "$RUNNER_TEMP/out/make-test.log"
      - name: make test-app (B)
        if: ${{ !cancelled() }}
        env:
          TEST_RUNNER_AGTERM_REQUIRE_FISH: '1'
        run: make test-app 2>&1 | tee "$RUNNER_TEMP/out/make-test-app.log"
      - name: make lint (B)
        if: ${{ !cancelled() }}
        run: make lint 2>&1 | tee "$RUNNER_TEMP/out/make-lint.log"
      - name: Upload build and gate logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ab1037-build-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/out
            build/DerivedData/Logs/Test
          retention-days: 30
          if-no-files-found: warn
