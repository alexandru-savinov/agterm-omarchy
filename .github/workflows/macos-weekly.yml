name: Relaunch A/B arms for umputun/agterm Discussion 1037

# Helper only, never merged. Builds umputun master (A) and the PR head (B, A plus the ApplePersistenceIgnoreState
# registration) as Debug apps with `make build` and uploads both, so the A/B and the cold link and folder checks run
# on a Mac with exactly these bundles (.github/relaunch-ab-1037/ab-local.sh), runs the same A/B here (ab.sh), then runs the CONTRIBUTING
# gates at B in the same job, since hosted macOS arm64 capacity rarely gives a second job a runner. The file takes the fork's macos-weekly.yml name only because workflow_dispatch needs a name
# registered on the default branch; on this branch it is dispatch-only and the fork's main is untouched.
on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: umputun/agterm master commit (A)
        required: true
      head_sha:
        description: PR head, the base plus the registration commit (B)
        required: true
      arms_run:
        description: when set, skip building and gates; run the hosted A/B on that run's uploaded arms
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  ab-only:
    if: ${{ inputs.arms_run != '' }}
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      BASE_SHA: ${{ inputs.base_sha }}
      HEAD_SHA: ${{ inputs.head_sha }}
    steps:
      - name: Fetch the helper scripts
        run: |
          mkdir -p "$RUNNER_TEMP/helper" "$RUNNER_TEMP/out" && cd "$RUNNER_TEMP/helper"
          for f in ab.sh winctl.swift; do
            curl -fsSL "https://raw.githubusercontent.com/alexandru-savinov/agterm-omarchy/$GITHUB_SHA/.github/relaunch-ab-1037/$f" -o "$f"
          done
          sw_vers | tee "$RUNNER_TEMP/out/identity.log"
      - name: Download the arms
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ab1037-arms-${{ inputs.arms_run }}
          run-id: ${{ inputs.arms_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/arms
      - name: Hosted A/B and smoke checks
        run: |
          cat "$RUNNER_TEMP/arms/hashes.txt" | tee -a "$RUNNER_TEMP/out/identity.log"
          for arm in master patched; do
            grep -q "zip $(shasum -a 256 "$RUNNER_TEMP/arms/agterm-$arm.zip" | cut -d' ' -f1)" "$RUNNER_TEMP/arms/hashes.txt"
            mkdir -p "$RUNNER_TEMP/abarms/$arm"
            ditto -x -k "$RUNNER_TEMP/arms/agterm-$arm.zip" "$RUNNER_TEMP/abarms/$arm"
          done
          swiftc -O "$RUNNER_TEMP/helper/winctl.swift" -o "$RUNNER_TEMP/winctl"
          WINCTL="$RUNNER_TEMP/winctl" bash "$RUNNER_TEMP/helper/ab.sh" "$RUNNER_TEMP/abarms" "$RUNNER_TEMP/out/ab"
      - name: A/B summary
        if: always()
        run: |
          {
            echo "## Hosted A/B on the arms of run ${{ inputs.arms_run }} (A = $BASE_SHA, B = $HEAD_SHA)"
            for t in results smoke; do
              f="$RUNNER_TEMP/out/ab/$t.tsv"
              [ -f "$f" ] || continue
              echo
              awk -F'\t' '{ line = "|"; for (i = 1; i <= NF; i++) line = line " " $i " |"; print line } NR == 1 { line = "|"; for (i = 1; i <= NF; i++) line = line "---|"; print line }' "$f"
            done
            echo; echo '```'; tail -n 60 "$RUNNER_TEMP/out/ab/ab.log" 2>/dev/null; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ab1037-hosted-ab-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/out
          retention-days: 30

  arms:
    if: ${{ inputs.arms_run == '' }}
    runs-on: macos-26
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      BASE_SHA: ${{ inputs.base_sha }}
      HEAD_SHA: ${{ inputs.head_sha }}
    steps:
      - name: Check out umputun/agterm master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: umputun/agterm
          ref: ${{ inputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the patch and record identities
        run: |
          mkdir -p "$RUNNER_TEMP/out" "$RUNNER_TEMP/helper"
          # the helper scripts come from this workflow's own commit, kept outside the checked-out tree
          git fetch --no-tags https://github.com/alexandru-savinov/agterm-omarchy.git "$GITHUB_SHA"
          for f in ab.sh winctl.swift; do git show "FETCH_HEAD:.github/relaunch-ab-1037/$f" > "$RUNNER_TEMP/helper/$f"; done
          git fetch --no-tags https://github.com/alexandru-savinov/agterm-omarchy.git "$HEAD_SHA"
          {
            echo "umputun master now: $(git ls-remote https://github.com/umputun/agterm.git refs/heads/master)"
            echo "A (base): $(git rev-parse "$BASE_SHA")"
            echo "B (head): $(git rev-parse "$HEAD_SHA"), parent $(git rev-parse "$HEAD_SHA^")"
            git diff "$BASE_SHA" "$HEAD_SHA"
            sw_vers; uname -m; xcodebuild -version
          } | tee "$RUNNER_TEMP/out/identity.log"
          test "$(git rev-parse "$HEAD_SHA^")" = "$(git rev-parse "$BASE_SHA")"
      - name: Read pinned helper revisions
        id: revisions
        run: |
          echo "ghostty=$(sed -nE 's/^GHOSTTY_REV="([^"]+)".*/\1/p' scripts/setup.sh)" >> "$GITHUB_OUTPUT"
          echo "zmx=$(sed -nE 's/^ZMX_REV="([^"]+)".*/\1/p' scripts/setup.sh)" >> "$GITHUB_OUTPUT"
          echo "zmx_target=$(sed -nE 's/^ZMX_TARGET="([^"]+)".*/\1/p' scripts/setup.sh)" >> "$GITHUB_OUTPUT"
      # the gates job's keys and paths, so its saved artifacts are reused
      - name: Cache libghostty
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            GhosttyKit.xcframework
            agterm/Resources/ghostty
            agterm/Resources/terminfo
            .ghostty-build-stamp
          key: ab1037-gates-ghosttykit-${{ steps.revisions.outputs.ghostty }}-${{ hashFiles('scripts/ghostty-patches/*.patch') }}
      - name: Cache zmx
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            agterm/Resources/zmx
            .zmx-build-stamp
          key: ab1037-gates-zmx-${{ steps.revisions.outputs.zmx }}-${{ steps.revisions.outputs.zmx_target }}-${{ hashFiles('scripts/zmx-patches/**/*.patch') }}
      - name: Install Node for plugin tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install prerequisites
        run: |
          brew install xcodegen swiftlint fish
          sudo dscl . -create "/Users/$(id -un)" UserShell /bin/zsh
          { xcodegen --version; swiftlint version; fish --version; node --version; } | tee "$RUNNER_TEMP/out/prerequisites.log"
      - name: Stage libghostty and zmx
        run: scripts/setup.sh 2>&1 | tee "$RUNNER_TEMP/out/setup.log"
      - name: Build both arms (Debug, make build)
        run: |
          mkdir -p "$RUNNER_TEMP/arms"
          for arm in master patched; do
            sha=$BASE_SHA; [ "$arm" = patched ] && sha=$HEAD_SHA
            git checkout --quiet --detach "$sha"
            make build 2>&1 | tee "$RUNNER_TEMP/out/build-$arm.log" | tail -3
            app=build/DerivedData/Build/Products/Debug/agterm.app
            # ditto keeps the bundle's symlinks, modes and signatures, which the artifact zip alone would not
            ditto -c -k --keepParent "$app" "$RUNNER_TEMP/arms/agterm-$arm.zip"
            {
              echo "$arm $(git rev-parse HEAD)"
              echo "  zip $(shasum -a 256 "$RUNNER_TEMP/arms/agterm-$arm.zip" | cut -d' ' -f1)"
              (cd "$app/Contents/MacOS" && shasum -a 256 agterm agterm.debug.dylib agtermctl zmx agterm-session-host | sed 's/^/  /')
              echo "  ApplePersistenceIgnoreState in dylib: $(grep -a -c ApplePersistenceIgnoreState "$app/Contents/MacOS/agterm.debug.dylib")"
              codesign -dv "$app" 2>&1 | grep -E '^(Identifier|CDHash|Signature)' | sed 's/^/  /'
            } | tee -a "$RUNNER_TEMP/arms/hashes.txt"
          done
          cp "$RUNNER_TEMP/out/identity.log" "$RUNNER_TEMP/arms/"
          cat "$RUNNER_TEMP/arms/hashes.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload both arms
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ab1037-arms-${{ github.run_id }}
          path: ${{ runner.temp }}/arms
          retention-days: 30
      - name: Compile the window counter
        run: swiftc -O "$RUNNER_TEMP/helper/winctl.swift" -o "$RUNNER_TEMP/winctl"
      - name: Hosted A/B and smoke checks
        id: ab
        env:
          WINCTL: ${{ runner.temp }}/winctl
        run: |
          mkdir -p "$RUNNER_TEMP/abarms/master" "$RUNNER_TEMP/abarms/patched"
          for arm in master patched; do ditto -x -k "$RUNNER_TEMP/arms/agterm-$arm.zip" "$RUNNER_TEMP/abarms/$arm"; done
          bash "$RUNNER_TEMP/helper/ab.sh" "$RUNNER_TEMP/abarms" "$RUNNER_TEMP/out/ab"
      - name: A/B summary
        if: always()
        run: |
          {
            echo "## Hosted A/B (A = $BASE_SHA, B = $HEAD_SHA)"
            for t in results smoke; do
              f="$RUNNER_TEMP/out/ab/$t.tsv"
              [ -f "$f" ] || continue
              echo
              awk -F'\t' '{ line = "|"; for (i = 1; i <= NF; i++) line = line " " $i " |"; print line } NR == 1 { line = "|"; for (i = 1; i <= NF; i++) line = line "---|"; print line }' "$f"
            done
            echo; echo '```'; tail -n 40 "$RUNNER_TEMP/out/ab/ab.log" 2>/dev/null; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # B is checked out and built by `make build` above; every gate runs even when another fails
      - name: make test (B)
        if: ${{ !cancelled() }}
        env:
          AGTERM_REQUIRE_FISH: '1'
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          make test 2>&1 | tee "$RUNNER_TEMP/out/make-test.log"
      - name: make test-app (B)
        if: ${{ !cancelled() }}
        env:
          TEST_RUNNER_AGTERM_REQUIRE_FISH: '1'
        run: make test-app 2>&1 | tee "$RUNNER_TEMP/out/make-test-app.log"
      - name: make lint (B)
        if: ${{ !cancelled() }}
        run: make lint 2>&1 | tee "$RUNNER_TEMP/out/make-lint.log"
      - name: Upload build and gate logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ab1037-build-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/out
            build/DerivedData/Logs/Test
          retention-days: 30
          if-no-files-found: warn
